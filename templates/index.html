<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>VULNSCAN v3.0 — Advanced Web Security Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card: #0c1120;
            --border: #1e2d4a;
            --primary: #00ff88;
            --secondary: #0ea5e9;
            --accent: #f59e0b;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --font-mono: 'JetBrains Mono', monospace;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ═══════════════════════════════════════════ */
        /* FIX 1: OVERFLOW - Universal box-sizing     */
        /* ═══════════════════════════════════════════ */
        * { margin: 0; padding: 0; box-sizing: border-box; max-width: 100%; }
        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Text wraps properly */
        p, span, div, td, th, li {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* URLs and code break properly */
        .url, code, pre, .mono, [class*="mono"],
        .finding-endpoint span,
        .detail-list a,
        .sub-name, .sub-ip {
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            max-width: 100%;
        }

        /* Tables scroll horizontally */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            border-radius: 8px;
        }
        table {
            min-width: 100%;
            table-layout: auto;
        }

        /* Cards don't overflow */
        .finding-card, .card, [class*="panel-card"], .sev-card, .form-card {
            overflow: hidden;
            max-width: 100%;
        }

        /* Tabs scroll on mobile */
        .tab-nav {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            padding-bottom: 4px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tab-nav::-webkit-scrollbar { display: none; }

        /* Bottom bar doesn't overflow */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(3, 7, 18, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: none;
            justify-content: center;
            gap: 12px;
            z-index: 1000;
            flex-wrap: wrap;
            overflow: hidden;
            width: 100%;
        }
        .bottom-bar.show { display: flex; }

        /* ═══════════════════════════════════════════ */
        /* FIX 2: SCROLLING                           */
        /* ═══════════════════════════════════════════ */
        .terminal-body {
            padding: 18px 20px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--primary);
            min-height: 140px;
            max-height: 300px;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .terminal-body::-webkit-scrollbar { width: 6px; }
        .terminal-body::-webkit-scrollbar-track { background: transparent; }
        .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .results-section {
            display: none;
            animation: fadeInUp 0.6s ease forwards;
            overflow: visible;
        }

        /* ═══════════════════════════════════════════ */
        /* FIX 3: BUTTONS                             */
        /* ═══════════════════════════════════════════ */
        button, .btn {
            min-height: 40px;
            cursor: pointer;
        }

        /* ═══════════════════════════════════════════ */
        /* FIX 4: TEXT SIZE - Responsive clamp()      */
        /* ═══════════════════════════════════════════ */
        h1 { font-size: clamp(24px, 5vw, 48px); }
        h2 { font-size: clamp(16px, 3vw, 24px); }
        h3 { font-size: clamp(14px, 2.5vw, 18px); }

        /* ═══════════════════════════════════════════ */
        /* FIX 5: COLORS - Severity badges            */
        /* ═══════════════════════════════════════════ */
        .severity-critical, .sev-critical { background: #ef4444; color: white; }
        .severity-high, .sev-high { background: #f97316; color: white; }
        .severity-medium, .sev-medium { background: #f59e0b; color: black; }
        .severity-low, .sev-low { background: #3b82f6; color: white; }
        .severity-info, .sev-info { background: #6366f1; color: white; }
        .finding-description, .finding-desc-text { color: var(--text); }
        .muted-text { color: var(--muted); }

        /* ═══════════════════════════════════════════ */
        /* TOAST NOTIFICATION                         */
        /* ═══════════════════════════════════════════ */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--card);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 12px 20px;
            color: var(--primary);
            font-size: 13px;
            font-family: var(--font-mono);
            z-index: 10000;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: 0 4px 30px rgba(0, 255, 136, 0.1);
            max-width: 380px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* ═══════════════════════════════════════════ */
        /* FIX 6: STICKY NAVBAR - Mobile fix          */
        /* ═══════════════════════════════════════════ */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(3, 7, 18, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: clamp(16px, 3vw, 24px);
            color: var(--primary);
            letter-spacing: 1px;
        }
        .nav-brand .version {
            font-size: 11px;
            font-weight: 400;
            color: var(--muted);
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 1px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
            animation: statusPulse 2s ease-in-out infinite;
        }
        .status-dot.scanning {
            background: var(--accent);
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
            animation: statusPulse 0.8s ease-in-out infinite;
        }
        .status-dot.complete {
            background: var(--secondary);
            box-shadow: 0 0 8px rgba(14, 165, 233, 0.6);
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .nav-shortcuts {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: var(--muted);
            font-family: var(--font-mono);
        }
        .nav-shortcuts kbd {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 10px;
        }

        /* ═══════════════════════════════════════════ */
        /* MAIN CONTAINER                             */
        /* ═══════════════════════════════════════════ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            padding-bottom: 100px;
        }

        /* ═══════════════════════════════════════════ */
        /* HERO SECTION                               */
        /* ═══════════════════════════════════════════ */
        .hero {
            padding: 60px 0 40px;
            text-align: center;
        }
        .hero-label {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 24px;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .hero-label::before {
            content: '> ';
            color: var(--muted);
        }

        /* ═══════════════════════════════════════════ */
        /* FIX 7: INPUT - Fix on all screens          */
        /* ═══════════════════════════════════════════ */
        .input-wrapper {
            display: flex;
            gap: 12px;
            max-width: 700px;
            margin: 0 auto 20px;
            align-items: stretch;
        }
        .url-input {
            flex: 1;
            min-width: 0;
            width: 100%;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            font-family: var(--font-mono);
        }
        .url-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.08), 0 0 60px rgba(0, 255, 136, 0.03);
        }
        .url-input.invalid {
            border-color: var(--danger);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
        }
        .url-input::placeholder { color: #334155; }
        .scan-btn {
            background: var(--primary);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 16px 28px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: all 0.3s;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-ui);
            min-height: 40px;
        }
        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }
        .scan-btn:disabled {
            background: var(--border);
            color: var(--muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .scan-btn.scanning {
            background: var(--accent);
            animation: btnPulse 1.5s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
        }

        /* Scan Mode Chips */
        .scan-modes {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .mode-chip {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-mono);
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mode-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .mode-chip.active {
            background: rgba(0, 255, 136, 0.08);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 500;
        }
        .mode-chip .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 2px solid currentColor;
        }
        .mode-chip.active .dot {
            background: currentColor;
        }

        /* ═══════════════════════════════════════════ */
        /* TERMINAL WINDOW                            */
        /* ═══════════════════════════════════════════ */
        .terminal-section {
            display: none;
            margin-bottom: 32px;
        }
        .terminal-window {
            background: #040a14;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }
        .terminal-header {
            background: #0a1628;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .terminal-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
        .terminal-dot.red { background: #ef4444; }
        .terminal-dot.yellow { background: #f59e0b; }
        .terminal-dot.green { background: #00ff88; }
        .terminal-title {
            color: var(--muted);
            font-size: 11px;
            font-family: var(--font-mono);
            margin-left: 10px;
            letter-spacing: 0.5px;
        }
        .terminal-minimize {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            transition: all 0.2s;
            min-height: unset;
        }
        .terminal-minimize:hover { border-color: var(--primary); color: var(--primary); }
        .terminal-prompt {
            color: var(--secondary);
            margin-bottom: 8px;
        }
        .terminal-line {
            margin-bottom: 4px;
            opacity: 0;
            animation: termFadeIn 0.3s forwards;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            font-size: clamp(11px, 1.5vw, 13px);
        }
        .terminal-line .timestamp {
            color: var(--muted);
            font-size: 11px;
            flex-shrink: 0;
            min-width: 72px;
        }
        .terminal-line .content { flex: 1; }
        .terminal-line.success .content { color: var(--primary); }
        .terminal-line.progress .content { color: var(--accent); }
        .terminal-line.error .content { color: var(--danger); }
        .terminal-line.info .content { color: var(--secondary); }
        @keyframes termFadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--primary);
            animation: cursorBlink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .progress-bar-bottom {
            height: 3px;
            background: rgba(30, 45, 74, 0.5);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 0 3px 3px 0;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        /* ═══════════════════════════════════════════ */
        /* SKELETON LOADING                           */
        /* ═══════════════════════════════════════════ */
        .skeleton-container { display: none; margin-bottom: 24px; }
        .skeleton-container.show { display: block; }
        .skeleton {
            background: linear-gradient(90deg, var(--card) 25%, #152238 50%, var(--card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .skeleton-card { height: 80px; }
        .skeleton-row { height: 20px; width: 80%; }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        /* ═══════════════════════════════════════════ */
        /* RESULTS SECTION                            */
        /* ═══════════════════════════════════════════ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Severity Summary Cards */
        .severity-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }
        .sev-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 22px 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .sev-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }
        .sev-card.critical::before { background: var(--danger); }
        .sev-card.critical:hover { border-color: var(--danger); box-shadow: 0 4px 25px rgba(239, 68, 68, 0.15); }
        .sev-card.high::before { background: #f97316; }
        .sev-card.high:hover { border-color: #f97316; box-shadow: 0 4px 25px rgba(249, 115, 22, 0.15); }
        .sev-card.medium::before { background: var(--accent); }
        .sev-card.medium:hover { border-color: var(--accent); box-shadow: 0 4px 25px rgba(245, 158, 11, 0.15); }
        .sev-card.low::before { background: var(--secondary); }
        .sev-card.low:hover { border-color: var(--secondary); box-shadow: 0 4px 25px rgba(14, 165, 233, 0.15); }
        .sev-card .num {
            font-size: 36px;
            font-weight: 700;
            font-family: var(--font-mono);
            line-height: 1;
        }
        .sev-card.critical .num { color: var(--danger); }
        .sev-card.high .num { color: #f97316; }
        .sev-card.medium .num { color: var(--accent); }
        .sev-card.low .num { color: var(--secondary); }
        .sev-card .lbl {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 8px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Risk Banner */
        .risk-banner {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 22px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .risk-badge {
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }
        .scan-meta {
            color: var(--muted);
            font-size: 12px;
            font-family: var(--font-mono);
        }

        /* ═══════════════════════════════════════════ */
        /* TAB NAVIGATION                             */
        /* ═══════════════════════════════════════════ */
        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: clamp(11px, 1.8vw, 14px);
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-ui);
            font-weight: 500;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
        }
        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .tab-btn.active {
            background: rgba(0, 255, 136, 0.08);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }
        .tab-btn .badge-count {
            background: rgba(0, 255, 136, 0.15);
            color: var(--primary);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-family: var(--font-mono);
            font-weight: 600;
        }
        .tab-panel {
            display: none;
            animation: fadeInUp 0.4s ease;
        }
        .tab-panel.active {
            display: block;
        }

        /* ═══════════════════════════════════════════ */
        /* FINDING CARDS (Terminal monospace style)    */
        /* ═══════════════════════════════════════════ */
        .findings-list { display: flex; flex-direction: column; gap: 14px; }
        .finding-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s;
            opacity: 0;
            transform: translateY(10px);
            animation: staggerFade 0.4s forwards;
            max-width: 100%;
        }
        .finding-card:hover { border-color: #2e4066; }
        .finding-card-header {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-left: 4px solid var(--muted);
            transition: all 0.2s;
        }
        .finding-card-header.sev-critical { border-left-color: var(--danger); }
        .finding-card-header.sev-high { border-left-color: #f97316; }
        .finding-card-header.sev-medium { border-left-color: var(--accent); }
        .finding-card-header.sev-low { border-left-color: var(--secondary); }
        .finding-card-header.sev-info { border-left-color: var(--muted); }
        .finding-left { flex: 1; min-width: 0; }
        .finding-badges {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .sev-badge {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }
        .cvss-tag {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
        }
        .cvss-critical { color: var(--danger); }
        .cvss-high { color: #f97316; }
        .cvss-medium { color: var(--accent); }
        .cvss-low { color: var(--secondary); }
        .cvss-info { color: var(--muted); }
        .cvss-score { font-size: clamp(16px, 3vw, 24px); }
        .category-tag {
            font-size: 10px;
            color: var(--primary);
            background: rgba(0, 255, 136, 0.06);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: var(--font-mono);
        }
        .finding-title {
            font-size: clamp(13px, 2vw, 16px);
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        .finding-hint {
            font-size: 11px;
            color: var(--muted);
            font-family: var(--font-mono);
        }
        .finding-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            border-top: 0px solid transparent;
        }
        .finding-details.expanded {
            max-height: 800px;
            border-top: 1px solid var(--border);
        }
        .finding-details-inner {
            padding: 16px 20px;
        }
        .finding-section-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            margin-top: 14px;
            font-family: var(--font-mono);
        }
        .finding-section-label:first-child { margin-top: 0; }
        .finding-desc-text {
            font-size: 13px;
            color: var(--text);
            line-height: 1.7;
        }
        .finding-endpoint {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--primary);
            background: rgba(0, 255, 136, 0.04);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            word-break: break-all;
        }
        .finding-fix-box {
            background: rgba(245, 158, 11, 0.04);
            border-left: 3px solid var(--accent);
            padding: 12px 14px;
            border-radius: 0 6px 6px 0;
            margin-top: 14px;
        }
        .finding-fix-box .fix-label {
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-family: var(--font-mono);
        }
        .finding-fix-box .fix-text {
            font-size: 13px;
            color: var(--text);
            line-height: 1.6;
        }

        /* ═══════════════════════════════════════════ */
        /* INFO PANELS (Domain, SSL, Ports, etc)      */
        /* ═══════════════════════════════════════════ */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 13px;
        }
        .info-table tr {
            border-bottom: 1px solid var(--border);
        }
        .info-table tr:last-child { border-bottom: none; }
        .info-table td {
            padding: 12px 16px;
            vertical-align: top;
        }
        .info-table td:first-child {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            width: 140px;
            font-weight: 500;
        }
        .info-table td:last-child {
            color: var(--text);
            word-break: break-all;
        }
        .info-table .val-good { color: var(--primary); }
        .info-table .val-warn { color: var(--accent); }
        .info-table .val-bad { color: var(--danger); }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .info-item {
            background: rgba(12, 17, 32, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }
        .info-item .label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: 600;
            font-family: var(--font-mono);
        }
        .info-item .value {
            font-size: 13px;
            color: #fff;
            font-family: var(--font-mono);
            word-break: break-all;
        }
        .info-item .value.good { color: var(--primary); }
        .info-item .value.warn { color: var(--accent); }
        .info-item .value.bad { color: var(--danger); }

        /* SSL Grid */
        .ssl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .ssl-item {
            background: rgba(12, 17, 32, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }
        .ssl-item .label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: 500;
            font-family: var(--font-mono);
        }
        .ssl-item .value {
            font-size: 13px;
            color: #fff;
            font-family: var(--font-mono);
            word-break: break-all;
        }

        /* Port Badges */
        .port-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .port-badge {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid var(--primary);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--primary);
            font-family: var(--font-mono);
            transition: all 0.2s;
        }
        .port-badge:hover { background: rgba(0, 255, 136, 0.1); }
        .port-badge.danger {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }

        /* Tech Tags */
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tech-tag {
            background: rgba(0, 255, 136, 0.04);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--primary);
            font-family: var(--font-mono);
            transition: all 0.2s;
        }
        .tech-tag:hover { border-color: var(--primary); background: rgba(0, 255, 136, 0.08); }

        /* Detail Lists */
        .detail-list { list-style: none; }
        .detail-list li {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text);
            font-family: var(--font-mono);
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .detail-list li:last-child { border-bottom: none; }

        /* Copy Button */
        .copy-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
