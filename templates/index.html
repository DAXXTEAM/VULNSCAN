            letter-spacing: 0.5px;
            min-height: unset;
        }
        .copy-btn:hover { border-color: var(--primary); color: var(--primary); }
        .copy-btn.copied { border-color: var(--primary); color: var(--primary); }

        /* Headers Table */
        .headers-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
            display: table;
            table-layout: auto;
        }
        .headers-table th, .headers-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .headers-table th {
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 1px;
            font-family: var(--font-mono);
            background: rgba(12, 17, 32, 0.5);
        }
        .headers-table td {
            font-family: var(--font-mono);
            max-width: 300px;
            word-wrap: break-word;
        }
        .check-icon { color: var(--primary); font-size: 18px; }
        .cross-icon { color: var(--danger); font-size: 18px; }

        /* Subdomain Grid */
        .subdomain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 8px;
        }
        .subdomain-item {
            background: rgba(12, 17, 32, 0.5);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 12px;
            font-family: var(--font-mono);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }
        .subdomain-item:hover { border-color: var(--primary); }
        .subdomain-item .sub-name { color: var(--primary); }
        .subdomain-item .sub-ip { color: var(--muted); }

        /* Social Grid */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .social-item {
            background: rgba(12, 17, 32, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s;
        }
        .social-item:hover { border-color: #2e4066; }
        .social-item .platform { color: #fff; font-weight: 600; text-transform: capitalize; font-size: 13px; }
        .social-item .sdot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }
        .social-item .sdot.found { background: var(--primary); box-shadow: 0 0 8px rgba(0, 255, 136, 0.5); }
        .social-item .sdot.not-found { background: var(--danger); }

        /* Form Cards */
        .form-card {
            background: rgba(12, 17, 32, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            overflow: hidden;
            max-width: 100%;
        }
        .form-card .form-meta {
            font-size: 12px;
            color: var(--text);
            margin-bottom: 6px;
            word-break: break-all;
            font-family: var(--font-mono);
        }
        .form-issue {
            color: var(--danger);
            font-size: 12px;
            padding: 2px 0;
        }

        /* No Data */
        .no-data {
            color: var(--muted);
            font-style: italic;
            font-size: 13px;
            padding: 10px 0;
        }

        /* Panel Wrapper */
        .panel-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
            overflow: hidden;
            max-width: 100%;
        }
        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ═══════════════════════════════════════════ */
        /* STICKY BOTTOM BAR BUTTONS                  */
        /* ═══════════════════════════════════════════ */
        .bar-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
            min-height: 40px;
        }
        .bar-btn:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.1);
        }
        .bar-btn.primary {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }
        .bar-btn.primary:hover {
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
        }

        /* ═══════════════════════════════════════════ */
        /* FOOTER                                     */
        /* ═══════════════════════════════════════════ */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px 0;
            border-top: 1px solid var(--border);
        }
        .footer p {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
            font-family: var(--font-mono);
        }
        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-size: 12px;
            font-family: var(--font-mono);
            transition: color 0.2s;
        }
        .footer a:hover { color: var(--secondary); }

        /* ═══════════════════════════════════════════ */
        /* ANIMATIONS                                 */
        /* ═══════════════════════════════════════════ */
        .stagger-in {
            opacity: 0;
            transform: translateY(20px);
            animation: staggerFade 0.5s forwards;
        }
        @keyframes staggerFade {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ═══════════════════════════════════════════ */
        /* RESPONSIVE                                 */
        /* ═══════════════════════════════════════════ */
        @media (max-width: 900px) {
            .severity-cards { grid-template-columns: repeat(2, 1fr); }
            .info-grid { grid-template-columns: repeat(2, 1fr); }
            .ssl-grid { grid-template-columns: repeat(2, 1fr); }
            .skeleton-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .hero { padding: 40px 0 30px; }
            .hero-label { font-size: 12px; }
            .container { padding: 0 12px; padding-bottom: 90px; }
            .input-wrapper { flex-direction: column; }
            .scan-btn { width: 100%; justify-content: center; padding: 16px; }
            .url-input { font-size: 14px; padding: 14px 16px; width: 100%; }
            .severity-cards { grid-template-columns: 1fr 1fr; gap: 10px; }
            .sev-card { padding: 16px 12px; }
            .sev-card .num { font-size: 28px; }
            .risk-banner { flex-direction: column; align-items: flex-start; }
            .tab-nav { gap: 6px; }
            .tab-btn { padding: 8px 12px; font-size: 11px; }
            .terminal-body { font-size: 11px; min-height: 100px; max-height: 250px; }
            .finding-card-header { padding: 14px 16px; }
            .finding-details-inner { padding: 14px 16px; }
            .info-table td:first-child { width: 100px; font-size: 10px; }
            .info-grid { grid-template-columns: 1fr; }
            .ssl-grid { grid-template-columns: 1fr; }
            .subdomain-grid { grid-template-columns: 1fr; }
            .social-grid { grid-template-columns: 1fr; }
            .bottom-bar { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
            .bar-btn { padding: 10px 14px; font-size: 11px; flex: 1; justify-content: center; }
            .toast { right: 12px; left: 12px; top: 68px; max-width: none; }
            .navbar { padding: 0 12px; }
            .nav-shortcuts { display: none; }
            .nav-brand .version { display: none; }
            .keyboard-hint { display: none; }
        }
        @media (max-width: 600px) {
            .bottom-bar {
                flex-direction: column;
                padding: 10px;
            }
            .bottom-bar .bar-btn {
                width: 100%;
                margin: 4px 0;
                flex: unset;
            }
            .scan-btn {
                width: 100%;
                margin-top: 10px;
            }
            .input-wrapper {
                flex-direction: column;
                gap: 10px;
            }
            .url-input { width: 100%; }
        }
        @media (max-width: 480px) {
            .navbar { padding: 10px 15px; }
            .nav-status span:not(.status-dot) { display: none; }
            .nav-brand { font-size: 14px; }
            .sev-card .num { font-size: 24px; }
            .mode-chip { padding: 6px 12px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Sticky Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            🛡 VULNSCAN <span class="version">v3.0</span>
        </div>
        <div class="nav-shortcuts keyboard-hint">
            <span><kbd>Enter</kbd> Scan</span>
            <span><kbd>Esc</kbd> Cancel</span>
            <span><kbd>Ctrl+D</kbd> Download</span>
        </div>
        <div class="nav-status" id="navStatus">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">READY</span>
        </div>
    </nav>

    <div class="container">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-label">ENTER TARGET URL</div>
            <div class="input-wrapper">
                <input type="text" class="url-input" id="urlInput"
                       placeholder="https://example.com"
                       autocomplete="off" spellcheck="false">
                <button class="scan-btn" id="scanBtn" onclick="startScan()">
                    ⚡ SCAN TARGET
                </button>
            </div>
            <div class="scan-modes">
                <span class="mode-chip active" data-mode="full" onclick="selectScanMode(this)">
                    <span class="dot"></span> FULL SCAN
                </span>
                <span class="mode-chip" data-mode="headers" onclick="selectScanMode(this)">
                    <span class="dot"></span> HEADERS
                </span>
                <span class="mode-chip" data-mode="domain" onclick="selectScanMode(this)">
                    <span class="dot"></span> DOMAIN
                </span>
            </div>
        </section>

        <!-- Terminal Window -->
        <section class="terminal-section" id="terminalSection">
            <div class="terminal-window">
                <div class="terminal-header">
                    <div class="terminal-header-left">
                        <span class="terminal-dot red"></span>
                        <span class="terminal-dot yellow"></span>
                        <span class="terminal-dot green"></span>
                        <span class="terminal-title">TERMINAL — vulnscan@target</span>
                    </div>
                    <button class="terminal-minimize" onclick="toggleTerminal()">minimize</button>
                </div>
                <div class="terminal-body" id="terminalBody">
                    <div class="terminal-prompt">vulnscan@target:~$</div>
                </div>
                <div class="progress-bar-bottom">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </section>

        <!-- Skeleton Loading -->
        <div class="skeleton-container" id="skeletonContainer">
            <div class="skeleton-grid">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="skeleton skeleton-row" style="margin-bottom:16px;"></div>
            <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
            <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
            <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
        </div>

        <!-- Results Section -->
        <section class="results-section" id="resultsSection">
            <!-- Severity Cards -->
            <div class="severity-cards" id="severityCards"></div>

            <!-- Risk Banner -->
            <div class="risk-banner" id="riskBanner"></div>

            <!-- Tab Navigation -->
            <div class="tab-nav" id="tabNav"></div>

            <!-- Tab Panels -->
            <div id="tabPanels"></div>
        </section>

        <!-- Footer -->
        <div class="footer">
            <p>Powered by VULNSCAN v3.0 — Built by Arpit Singh</p>
            <a href="https://github.com/DAXXTEAM/VULNSCAN" target="_blank">github.com/DAXXTEAM/VULNSCAN</a>
        </div>
    </div>

    <!-- Sticky Bottom Bar -->
    <div class="bottom-bar" id="bottomBar">
        <button class="bar-btn primary" onclick="downloadReport('pdf')">⬇ PDF REPORT</button>
        <button class="bar-btn" onclick="downloadReport('html')">⬇ HTML REPORT</button>
        <button class="bar-btn" onclick="scanAnother()">↩ NEW SCAN</button>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        let currentScanId = '';
        let selectedScanMode = 'full';
        let scanStartTime = null;
        let terminalMinimized = false;

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement === urlInput) startScan();
            if (e.key === 'Escape') cancelScan();
            if (e.ctrlKey && e.key === 'd') { e.preventDefault(); downloadReport('pdf'); }
        });

        urlInput.addEventListener('input', validateUrlInput);

        function validateUrlInput() {
            const val = urlInput.value.trim();
            if (!val) { urlInput.classList.remove('invalid'); return; }
            try {
                const url = new URL(val.startsWith('http') ? val : 'https://' + val);
                if (url.hostname.includes('.')) {
                    urlInput.classList.remove('invalid');
                } else {
                    urlInput.classList.add('invalid');
                }
            } catch {
                urlInput.classList.add('invalid');
            }
        }

        function selectScanMode(el) {
            document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedScanMode = el.dataset.mode;
        }

        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function setStatus(status) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = 'status-dot';
            if (status === 'scanning') {
                dot.classList.add('scanning');
                text.textContent = 'SCANNING';
            } else if (status === 'complete') {
                dot.classList.add('complete');
                text.textContent = 'COMPLETE';
            } else {
                text.textContent = 'READY';
            }
        }

        function toggleTerminal() {
            const body = document.getElementById('terminalBody');
            terminalMinimized = !terminalMinimized;
            body.style.display = terminalMinimized ? 'none' : 'block';
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✓ Copied';
                btn.classList.add('copied');
                showToast('✓ Copied!', 1500);
                setTimeout(() => { btn.textContent = '📋 COPY'; btn.classList.remove('copied'); }, 1500);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✓ Copied';
                btn.classList.add('copied');
                showToast('✓ Copied!', 1500);
                setTimeout(() => { btn.textContent = '📋 COPY'; btn.classList.remove('copied'); }, 1500);
            });
        }

        function getElapsedTime() {
            if (!scanStartTime) return '00:00:00';
            const elapsed = Math.floor((Date.now() - scanStartTime) / 1000);
            const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
            const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
            const s = String(elapsed % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function addTerminalLine(text, status) {
            const body = document.getElementById('terminalBody');
            const oldCursor = body.querySelector('.terminal-cursor');
            if (oldCursor) oldCursor.remove();

            const line = document.createElement('div');
            line.className = 'terminal-line ' + status;

            const prefix = status === 'success' ? '✓' : status === 'progress' ? '~' : status === 'error' ? '✗' : '●';
            line.innerHTML = `<span class="timestamp">[${getElapsedTime()}]</span><span class="content">${prefix} ${text}</span>`;

            const cursor = document.createElement('span');
            cursor.className = 'terminal-cursor';
            line.querySelector('.content').appendChild(cursor);

            body.appendChild(line);
            body.scrollTop = body.scrollHeight;
        }

        function markLastLineDone() {
            const body = document.getElementById('terminalBody');
            const lines = body.querySelectorAll('.terminal-line');
            if (lines.length) {
                const last = lines[lines.length - 1];
                last.classList.remove('progress');
                last.classList.add('success');
                const content = last.querySelector('.content');
                if (content) content.innerHTML = content.innerHTML.replace('~', '✓');
            }
        }

        let scanAbortController = null;

        function cancelScan() {
            if (scanAbortController) {
                scanAbortController.abort();
                scanAbortController = null;
                showToast('⚠ Scan cancelled', 2000);
                resetScanUI();
            }
        }

        function resetScanUI() {
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = false;
            scanBtn.innerHTML = '⚡ SCAN TARGET';
            scanBtn.classList.remove('scanning');
            document.getElementById('skeletonContainer').classList.remove('show');
            setStatus('ready');
        }

        async function startScan() {
            const url = urlInput.value.trim();
            if (!url) {
                urlInput.classList.add('invalid');
                urlInput.focus();
                setTimeout(() => urlInput.classList.remove('invalid'), 2000);
                return;
            }

            try {
                const testUrl = new URL(url.startsWith('http') ? url : 'https://' + url);
                if (!testUrl.hostname.includes('.')) throw new Error('invalid');
            } catch {
                urlInput.classList.add('invalid');
                showToast('⚠ Invalid URL format', 3000);
                return;
            }

            scanStartTime = Date.now();
            scanAbortController = new AbortController();

            showToast('⚡ Scan initiated for ' + url);
            setStatus('scanning');

            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = true;
            scanBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" stroke-dasharray="30 70" style="animation: spin 1s linear infinite;"/></svg> SCANNING...';
            scanBtn.classList.add('scanning');

            document.getElementById('terminalSection').style.display = 'block';
            document.getElementById('terminalBody').innerHTML = '<div class="terminal-prompt">vulnscan@target:~$ scan ' + escapeHtml(url) + '</div>';
            document.getElementById('skeletonContainer').classList.add('show');
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('bottomBar').classList.remove('show');
            document.getElementById('progressFill').style.width = '0%';

            const steps = [
                'Initializing scan engine...', 'Resolving DNS...',
                'Checking SSL/TLS certificates...', 'Analyzing security headers...',
                'Detecting technology stack...', 'Scanning exposed paths (166 endpoints)...',
                'Checking robots.txt & sitemap...', 'Analyzing cookies & CORS...',
                'Port scanning (21 ports)...', 'Harvesting emails...',
                'Enumerating subdomains...', 'Analyzing page content...',
                'Checking performance & CDN...', 'Verifying SPF/DMARC...',
                'Testing HTTP methods...', 'Checking social presence...',
                'Querying Wayback Machine...', 'IP geolocation lookup...',
                'Analyzing JavaScript files...', 'Checking external resources...',
                'Analyzing forms & inputs...', 'Generating report...'
            ];

            let step = 0;
            addTerminalLine(steps[0], 'progress');
            step++;

            const progressInterval = setInterval(() => {
                if (step < steps.length) {
                    markLastLineDone();
                    addTerminalLine(steps[step], 'progress');
                    document.getElementById('progressFill').style.width = ((step + 1) / steps.length * 90) + '%';
                    step++;
                }
            }, 2500);

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                    signal: scanAbortController.signal
                });

                clearInterval(progressInterval);
                markLastLineDone();
                addTerminalLine('Scan complete!', 'success');
                document.getElementById('progressFill').style.width = '100%';

                const data = await response.json();

                if (data.status === 'running') {
                    await pollForResults(data.scan_id);
                } else if (data.error && !data.findings) {
                    showError(data.error);
                } else {
                    setTimeout(() => renderResults(data), 400);
                }
            } catch (err) {
                clearInterval(progressInterval);
                if (err.name === 'AbortError') return;
                showError('Network error: ' + err.message);
            }

            scanAbortController = null;
            scanBtn.disabled = false;
            scanBtn.innerHTML = '⚡ SCAN TARGET';
            scanBtn.classList.remove('scanning');
            document.getElementById('skeletonContainer').classList.remove('show');
        }

        async function pollForResults(scanId) {
            for (let i = 0; i < 60; i++) {
                await new Promise(r => setTimeout(r, 2000));
                const resp = await fetch(`/scan/${scanId}/status`);
                const data = await resp.json();
                if (data.status === 'complete') {
                    renderResults(data.result);
                    return;
                }
                if (data.status === 'error') {
                    showError('Scan failed');
                    return;
                }
            }
            showError('Scan timed out');
        }

        function showError(msg) {
            setStatus('ready');
            document.getElementById('terminalSection').style.display = 'none';
            document.getElementById('skeletonContainer').classList.remove('show');
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('severityCards').innerHTML = '';
            document.getElementById('riskBanner').innerHTML = `<span style="color:var(--danger)">⚠ Error: ${escapeHtml(msg)}</span>`;
            document.getElementById('tabNav').innerHTML = '';
            document.getElementById('tabPanels').innerHTML = '';
            showToast('✗ ' + msg, 4000);
        }

        function scanAnother() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('bottomBar').classList.remove('show');
            document.getElementById('terminalSection').style.display = 'none';
            setStatus('ready');
            urlInput.value = '';
            urlInput.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getRiskColor(level) {
            const colors = { CRITICAL: '#ef4444', HIGH: '#f97316', MEDIUM: '#f59e0b', LOW: '#0ea5e9', INFORMATIONAL: '#64748b' };
            return colors[level] || '#64748b';
        }

        function getCvssClass(score) {
            if (score >= 9) return 'cvss-critical';
            if (score >= 7) return 'cvss-high';
            if (score >= 4) return 'cvss-medium';
            if (score > 0) return 'cvss-low';
            return 'cvss-info';
        }

        function toggleFinding(el) {
            const details = el.closest('.finding-card').querySelector('.finding-details');
            const hint = el.querySelector('.finding-hint');
            const isExpanded = details.classList.contains('expanded');
            details.classList.toggle('expanded');
            if (hint) hint.textContent = isExpanded ? '▸ Click to expand' : '▾ Click to collapse';
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
            document.getElementById('panel-' + tabId).classList.add('active');
        }

        function renderResults(data) {
            document.getElementById('skeletonContainer').classList.remove('show');
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('bottomBar').classList.add('show');
            setStatus('complete');

            currentScanId = data.scan_id;
            showToast('✓ Scan complete — ' + data.total_findings + ' findings (' + (data.modules_count || 24) + ' modules)');

            const riskColor = getRiskColor(data.risk_level);

            // Severity Cards
            document.getElementById('severityCards').innerHTML = `
                <div class="sev-card critical stagger-in" style="animation-delay:0.1s"><div class="num">${data.stats.critical}</div><div class="lbl">Critical</div></div>
                <div class="sev-card high stagger-in" style="animation-delay:0.2s"><div class="num">${data.stats.high}</div><div class="lbl">High</div></div>
                <div class="sev-card medium stagger-in" style="animation-delay:0.3s"><div class="num">${data.stats.medium}</div><div class="lbl">Medium</div></div>
                <div class="sev-card low stagger-in" style="animation-delay:0.4s"><div class="num">${data.stats.low}</div><div class="lbl">Low</div></div>
            `;

            // Risk Banner
            document.getElementById('riskBanner').innerHTML = `
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                    <span class="risk-badge" style="background:${riskColor};color:#fff">${data.risk_level}</span>
                    <span style="color:var(--muted);font-size:12px;font-family:var(--font-mono);">MAX CVSS: ${data.max_cvss} | ${data.modules_count || 24} modules</span>
                </div>
                <div class="scan-meta">
                    ${data.total_findings} findings • ${data.duration_seconds}s • ${data.paths_checked || '166'} paths
                </div>
            `;

            // Build tabs
            const details = data.details || {};
            const tabs = [
                { id: 'findings', icon: '📋', label: 'Findings', count: data.total_findings },
                { id: 'domain', icon: '🌐', label: 'Domain', count: '' },
                { id: 'ssl', icon: '🔒', label: 'SSL', count: '' },
                { id: 'ports', icon: '🖧', label: 'Ports', count: (details.open_ports || []).length },
                { id: 'email', icon: '📧', label: 'Email', count: (details.emails || []).length },
                { id: 'performance', icon: '⚡', label: 'Performance', count: '' },
                { id: 'content', icon: '📄', label: 'Content', count: '' },
                { id: 'tech', icon: '⚙️', label: 'Tech', count: (details.tech_list || []).length },
                { id: 'subdomains', icon: '🔎', label: 'Subdomains', count: (details.subdomains || []).length },
                { id: 'headers', icon: '🛡️', label: 'Headers', count: '' },
            ];

            let tabNavHTML = '';
            tabs.forEach((t, i) => {
                const active = i === 0 ? 'active' : '';
                const badge = t.count !== '' ? `<span class="badge-count">${t.count}</span>` : '';
                tabNavHTML += `<button class="tab-btn ${active}" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.icon} ${t.label} ${badge}</button>`;
            });
            document.getElementById('tabNav').innerHTML = tabNavHTML;

            // Build panels
            let panelsHTML = '';

            // Findings panel
            panelsHTML += `<div id="panel-findings" class="tab-panel active">${renderFindings(data.findings)}</div>`;

            // Domain panel
            const whois = details.whois_detail || {};
            const geo = details.geo_detail || {};
            panelsHTML += `<div id="panel-domain" class="tab-panel">
                <div class="panel-card"><div class="panel-title">🌐 DOMAIN INTELLIGENCE</div>${renderWhois(whois)}</div>
                <div class="panel-card"><div class="panel-title">📍 IP & GEOLOCATION</div>${renderGeo(geo)}</div>
                ${renderWayback(details.wayback_detail || {})}
                ${renderSocialPresence(details.social_presence || {})}
            </div>`;

            // SSL panel
            panelsHTML += `<div id="panel-ssl" class="tab-panel"><div class="panel-card"><div class="panel-title">🔒 SSL/TLS CERTIFICATE</div>${renderSSL(details.ssl_detail || {})}</div></div>`;

            // Ports panel
            panelsHTML += `<div id="panel-ports" class="tab-panel"><div class="panel-card"><div class="panel-title">🖧 OPEN PORTS</div>${renderPorts(details.open_ports || [])}</div>
                <div class="panel-card"><div class="panel-title">🔧 HTTP METHODS</div>${renderHTTPMethods(details.http_methods || [])}</div>
                <div class="panel-card"><div class="panel-title">📂 EXPOSED FILES</div>${renderExposedFiles(details.exposed_files || [])}</div>
            </div>`;

            // Email panel
            panelsHTML += `<div id="panel-email" class="tab-panel">
                <div class="panel-card"><div class="panel-title">📧 EMAIL SECURITY (SPF/DMARC)</div>${renderEmailSecurity(details.email_security || {})}</div>
                <div class="panel-card"><div class="panel-title">✉️ EMAILS HARVESTED</div>${renderEmails(details.emails || [])}</div>
            </div>`;

            // Performance panel
            panelsHTML += `<div id="panel-performance" class="tab-panel"><div class="panel-card"><div class="panel-title">⚡ PERFORMANCE</div>${renderPerformance(details.performance_detail || {})}</div></div>`;

            // Content panel
            panelsHTML += `<div id="panel-content" class="tab-panel">
                <div class="panel-card"><div class="panel-title">📄 CONTENT ANALYSIS</div>${renderContent(details.content_detail || {})}</div>
                <div class="panel-card"><div class="panel-title">📝 FORM ANALYSIS</div>${renderForms(details.forms || [])}</div>
                <div class="panel-card"><div class="panel-title">🌍 SOCIAL MEDIA LINKS</div>${renderSocial(details.social_links || {})}</div>
                <div class="panel-card"><div class="panel-title">🔗 EXTERNAL RESOURCES</div>${renderExternal(details.external_domains || [])}</div>
                <div class="panel-card"><div class="panel-title">📜 JAVASCRIPT FILES</div>${renderJS(details.javascript || [])}</div>
            </div>`;

            // Tech panel
            panelsHTML += `<div id="panel-tech" class="tab-panel"><div class="panel-card"><div class="panel-title">⚙️ TECHNOLOGY STACK</div>${renderTechStack(details.tech_list || [], details.tech_detail || {})}</div></div>`;

            // Subdomains panel
            panelsHTML += `<div id="panel-subdomains" class="tab-panel"><div class="panel-card"><div class="panel-title">🔎 SUBDOMAINS</div>${renderSubdomains(details.subdomains || [])}</div></div>`;

            // Headers panel
            panelsHTML += `<div id="panel-headers" class="tab-panel"><div class="panel-card"><div class="panel-title">🛡️ SECURITY HEADERS</div>${renderHeadersTable(details.headers_detail || {})}</div></div>`;

            document.getElementById('tabPanels').innerHTML = panelsHTML;

            setTimeout(() => {
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ===== RENDER FUNCTIONS =====

        function renderFindings(findings) {
            if (!findings || !findings.length) return '<p class="no-data">No findings detected.</p>';
            let html = '<div class="findings-list">';
            findings.forEach((f, idx) => {
                const sevClass = `sev-${f.severity}`;
                const cvssClass = getCvssClass(f.cvss_score);
                html += `
                <div class="finding-card" style="animation-delay:${idx * 0.05}s">
                    <div class="finding-card-header ${sevClass}" onclick="toggleFinding(this)">
                        <div class="finding-left">
                            <div class="finding-badges">
                                <span class="sev-badge ${sevClass}">${f.severity}</span>
                                <span class="cvss-tag ${cvssClass}">CVSS ${f.cvss_score}</span>
                                ${f.category ? `<span class="category-tag">${escapeHtml(f.category)}</span>` : ''}
                            </div>
                            <div class="finding-title">${escapeHtml(f.title)}</div>
                            <div class="finding-hint">▸ Click to expand</div>
                        </div>
                        <span class="cvss-score" style="font-family:var(--font-mono);font-weight:700;color:${getRiskColor(f.severity.toUpperCase())};flex-shrink:0;">${f.cvss_score}</span>
                    </div>
                    <div class="finding-details">
                        <div class="finding-details-inner">
                            ${f.affected_url ? `
                            <div class="finding-section-label">ENDPOINT</div>
                            <div class="finding-endpoint">
                                <span>${escapeHtml(f.affected_url)}</span>
                                <button class="copy-btn" onclick="event.stopPropagation();copyToClipboard('${escapeHtml(f.affected_url)}', this)">📋 COPY</button>
                            </div>` : ''}
                            <div class="finding-section-label">DESCRIPTION</div>
                            <div class="finding-desc-text">${escapeHtml(f.description)}</div>
                            ${f.business_impact ? `
                            <div class="finding-section-label">BUSINESS IMPACT</div>
                            <div class="finding-desc-text">${escapeHtml(f.business_impact)}</div>` : ''}
                            <div class="finding-fix-box">
                                <div class="fix-label">✓ FIX</div>
                                <div class="fix-text">${escapeHtml(f.recommendation)}</div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            html += '</div>';
            return html;
        }

        function renderWhois(whois) {
            if (!Object.keys(whois).length || (whois.registrar === 'N/A' && !whois.created)) return '<p class="no-data">WHOIS data not available for this domain.</p>';
            let html = '<div class="table-wrapper"><table class="info-table">';
            const items = [
                ['Registrar', whois.registrar || 'N/A'],
                ['Created', whois.created || 'N/A'],
                ['Expires', whois.expires || 'N/A'],
                ['Updated', whois.updated || 'N/A'],
                ['Domain Age', whois.domain_age || 'N/A'],
                ['Days to Expire', whois.days_to_expire !== undefined ? String(whois.days_to_expire) : 'N/A'],
                ['Organization', whois.org || 'N/A'],
                ['Country', whois.country || 'N/A'],
            ];
            for (const [label, value] of items) {
                let cls = '';
                if (label === 'Days to Expire') {
                    const d = parseInt(value);
                    if (!isNaN(d)) cls = d < 30 ? 'val-bad' : d < 90 ? 'val-warn' : 'val-good';
                }
                html += `<tr><td>${label}</td><td class="${cls}">${escapeHtml(value)}</td></tr>`;
            }
            html += '</table></div>';
            if (whois.name_servers && whois.name_servers.length) {
                html += `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
                    <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);">NAME SERVERS</div>
                    <div style="font-size:12px;color:var(--primary);font-family:var(--font-mono);">${whois.name_servers.join(' • ')}</div>
                </div>`;
            }
            return html;
        }

        function renderGeo(geo) {
            if (!geo.ip) return '<p class="no-data">IP geolocation data not available.</p>';
            let html = '<div class="table-wrapper"><table class="info-table">';
            const items = [
                ['IP Address', geo.ip],
                ['Country', geo.country || 'N/A'],
                ['Region', geo.region || 'N/A'],
                ['City', geo.city || 'N/A'],
                ['ISP', geo.isp || 'N/A'],
                ['Organization', geo.org || 'N/A'],
                ['AS Number', geo.as || 'N/A'],
                ['Coordinates', geo.lat && geo.lon ? `${geo.lat}, ${geo.lon}` : 'N/A'],
            ];
            for (const [label, value] of items) {
                html += `<tr><td>${label}</td><td>${escapeHtml(String(value))}</td></tr>`;
            }
            html += '</table></div>';
            return html;
        }

        function renderSubdomains(subdomains) {
            if (!subdomains.length) return '<p class="no-data">No subdomains found from common prefixes scan.</p>';
            let html = `<p style="color:var(--muted);font-size:12px;margin-bottom:12px;font-family:var(--font-mono);">${subdomains.length} subdomains discovered:</p>`;
            html += '<div class="subdomain-grid">';
            for (const s of subdomains) {
                html += `<div class="subdomain-item"><span class="sub-name">${escapeHtml(s.subdomain)}</span><span class="sub-ip">${escapeHtml(s.ip)}</span></div>`;
            }
            html += '</div>';
            return html;
        }

        function renderContent(content) {
            if (!Object.keys(content).length) return '<p class="no-data">Content analysis data not available.</p>';
            let html = '<div class="info-grid">';
            const items = [
                ['Title', content.title || '(No title)'],
                ['Word Count', String(content.word_count || 0)],
                ['Page Size', `${content.page_size_kb || 0} KB`],
                ['Total Links', String(content.total_links || 0)],
                ['Internal Links', String(content.internal_links || 0)],
                ['External Links', String(content.external_links || 0)],
                ['Images', String(content.images || 0)],
                ['Scripts', String(content.scripts || 0)],
            ];
            for (const [label, value] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            if (content.meta_description) {
                html += `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);">META DESCRIPTION</div><div style="font-size:12px;color:var(--text);line-height:1.6;">${escapeHtml(content.meta_description)}</div></div>`;
            }
            if (content.h1_tags && content.h1_tags.length) {
                html += `<div style="margin-top:12px;"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);">H1 TAGS</div><div style="font-size:12px;color:var(--text);">${content.h1_tags.map(h => escapeHtml(h)).join(' | ')}</div></div>`;
            }
            if (content.contact_emails && content.contact_emails.length) {
                html += `<div style="margin-top:12px;"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);">CONTACT EMAILS</div><div style="font-size:12px;color:var(--primary);font-family:var(--font-mono);">${content.contact_emails.join(', ')}</div></div>`;
            }
            if (content.phone_numbers && content.phone_numbers.length) {
                html += `<div style="margin-top:12px;"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);">PHONE NUMBERS</div><div style="font-size:12px;color:var(--primary);font-family:var(--font-mono);">${content.phone_numbers.join(', ')}</div></div>`;
            }
            return html;
        }

        function renderPerformance(perf) {
            if (!Object.keys(perf).length) return '<p class="no-data">Performance data not available.</p>';
            let timeClass = perf.load_time_seconds < 2 ? 'good' : perf.load_time_seconds < 5 ? 'warn' : 'bad';
            let html = '<div class="info-grid">';
            const items = [
                ['Load Time', `${perf.load_time_seconds}s`, timeClass],
                ['Response Size', `${perf.response_size_kb} KB`, ''],
                ['Status Code', String(perf.status_code || 'N/A'), perf.status_code === 200 ? 'good' : 'warn'],
                ['CDN Detected', perf.cdn_detected ? `Yes (${perf.cdn_provider || 'Unknown'})` : 'No', perf.cdn_detected ? 'good' : ''],
                ['Cache Control', perf.cache_control || 'None', perf.cache_control && perf.cache_control !== 'None' ? 'good' : 'warn'],
                ['Compression', perf.content_encoding || 'None', perf.content_encoding && perf.content_encoding !== 'None' ? 'good' : 'warn'],
            ];
            for (const [label, value, cls] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            return html;
        }

        function renderEmailSecurity(emailSec) {
            if (!Object.keys(emailSec).length) return '<p class="no-data">Email security data not available.</p>';
            let html = '<div class="info-grid">';
            const spfStatus = emailSec.spf ? 'Configured' : 'Missing';
            const dmarcStatus = emailSec.dmarc ? 'Configured' : 'Missing';
            const items = [
                ['SPF Record', spfStatus, emailSec.spf ? 'good' : 'bad'],
                ['DMARC Record', dmarcStatus, emailSec.dmarc ? 'good' : 'bad'],
                ['MX Records', emailSec.mx_records ? `${emailSec.mx_records.length} found` : 'None', emailSec.mx_records && emailSec.mx_records.length ? 'good' : ''],
            ];
            for (const [label, value, cls] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            if (emailSec.spf) {
                html += `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);">SPF RECORD</div><div style="font-size:11px;color:var(--primary);font-family:var(--font-mono);word-break:break-all;">${escapeHtml(emailSec.spf)}</div></div>`;
            }
            if (emailSec.dmarc) {
                html += `<div style="margin-top:12px;"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);">DMARC RECORD</div><div style="font-size:11px;color:var(--primary);font-family:var(--font-mono);word-break:break-all;">${escapeHtml(emailSec.dmarc)}</div></div>`;
            }
            if (emailSec.mx_records && emailSec.mx_records.length) {
                html += `<div style="margin-top:12px;"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);">MX RECORDS</div><div style="font-size:11px;color:var(--text);font-family:var(--font-mono);">${emailSec.mx_records.join('<br>')}</div></div>`;
            }
            return html;
        }

        function renderWayback(wayback) {
            if (!Object.keys(wayback).length) return '';
            let content = '';
            if (!wayback.available) {
                content = '<p class="no-data">No archived snapshots found on the Wayback Machine.</p>';
            } else {
                let ts = wayback.timestamp || '';
                let formatted = ts.length >= 8 ? `${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)}` : ts;
                content = `<div class="table-wrapper"><table class="info-table"><tr><td>Status</td><td class="val-good">Archived</td></tr><tr><td>Last Snapshot</td><td>${escapeHtml(formatted)}</td></tr></table></div>`;
                if (wayback.url) {
                    content += `<div style="margin-top:12px;"><a href="${escapeHtml(wayback.url)}" target="_blank" style="color:var(--primary);font-size:12px;text-decoration:none;font-family:var(--font-mono);">View on Wayback Machine →</a></div>`;
                }
            }
            return `<div class="panel-card"><div class="panel-title">📚 ARCHIVE HISTORY</div>${content}</div>`;
        }

        function renderSocialPresence(presence) {
            if (!Object.keys(presence).length) return '';
            let html = '<div class="social-grid">';
            for (const [platform, info] of Object.entries(presence)) {
                const dotClass = info.exists ? 'found' : 'not-found';
                const statusText = info.exists ? 'Found' : 'Not found';
                html += `<div class="social-item">
                    <span class="sdot ${dotClass}"></span>
                    <div>
                        <div class="platform">${platform}</div>
                        <div style="font-size:11px;color:var(--muted);">${statusText}</div>
                    </div>
                    ${info.exists && info.url ? `<a href="${escapeHtml(info.url)}" target="_blank" style="color:var(--primary);font-size:11px;margin-left:auto;text-decoration:none;font-family:var(--font-mono);">Visit →</a>` : ''}
                </div>`;
            }
            html += '</div>';
            return `<div class="panel-card"><div class="panel-title">👤 SOCIAL PRESENCE</div>${html}</div>`;
        }

        function renderHTTPMethods(methods) {
            if (!methods.length) return '<p style="color:var(--primary);font-size:13px;font-family:var(--font-mono);">✓ All dangerous HTTP methods are properly restricted.</p>';
            let html = '<div class="port-badges">';
            for (const m of methods) {
                const isDangerous = ['TRACE', 'TRACK', 'PUT', 'DELETE'].includes(m.method);
                html += `<span class="port-badge ${isDangerous ? 'danger' : ''}">${m.method} (${m.status})</span>`;
            }
            html += '</div>';
            return html;
        }

        function renderExposedFiles(files) {
            const exposed200 = files.filter(f => f.status === 200);
            const exposed403 = files.filter(f => f.status === 403);
            if (!exposed200.length && !exposed403.length) return '<p class="no-data">No exposed files found. All paths returned 404.</p>';
            let html = '';
            if (exposed200.length) {
                html += `<div style="color:var(--danger);font-size:12px;font-weight:600;margin-bottom:8px;font-family:var(--font-mono);">⚠ ACCESSIBLE (HTTP 200)</div><ul class="detail-list">`;
                for (const f of exposed200) {
                    html += `<li>
                        <span style="color:${f.severity==='high'?'var(--danger)':'var(--accent)'};font-size:11px;">[${f.severity.toUpperCase()}]</span>
                        <a href="${escapeHtml(f.url)}" target="_blank" style="color:var(--primary);flex:1;min-width:0;word-break:break-all;text-decoration:none;font-family:var(--font-mono);font-size:12px;">${escapeHtml(f.path)}</a>
                        <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(f.url)}', this)">📋 COPY</button>
                    </li>`;
                }
                html += '</ul>';
            }
            if (exposed403.length) {
                html += `<div style="color:var(--accent);font-size:12px;font-weight:600;margin:16px 0 8px;font-family:var(--font-mono);">🔒 FORBIDDEN (HTTP 403)</div><ul class="detail-list">`;
                for (const f of exposed403) {
                    html += `<li style="color:var(--muted);">${escapeHtml(f.path)}</li>`;
                }
                html += '</ul>';
            }
            return html;
        }

        function renderHeadersTable(headers) {
            if (!Object.keys(headers).length) return '<p class="no-data">No header data available.</p>';
            let html = '<div class="table-wrapper"><table class="headers-table"><tr><th>Header</th><th>Status</th><th>Expected</th><th>Actual</th></tr>';
            for (const [name, info] of Object.entries(headers)) {
                const icon = info.present ? '<span class="check-icon">✓</span>' : '<span class="cross-icon">✗</span>';
                html += `<tr>
                    <td style="color:#fff;font-weight:600;">${name}</td>
                    <td>${icon}</td>
                    <td style="color:var(--muted);font-size:11px;">${escapeHtml(info.expected || '')}</td>
                    <td style="color:${info.present ? 'var(--primary)' : 'var(--danger)'};font-size:11px;">${info.present ? escapeHtml(info.actual || 'Set') : 'Missing'}</td>
                </tr>`;
            }
            html += '</table></div>';
            return html;
        }

        function renderTechStack(techList, techDetail) {
            if (!techList.length && !Object.keys(techDetail).length) return '<p class="no-data">No technologies detected.</p>';
            let html = '<div class="tech-tags">';
            for (const t of techList) {
                html += `<span class="tech-tag">${escapeHtml(t)}</span>`;
            }
            html += '</div>';
            if (Object.keys(techDetail).length) {
                html += '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;font-family:var(--font-mono);">';
                for (const [key, val] of Object.entries(techDetail)) {
                    html += `<div style="margin-bottom:4px;"><span style="color:var(--muted);">${key}:</span> <span style="color:var(--text);">${escapeHtml(String(val))}</span></div>`;
                }
                html += '</div>';
            }
            return html;
        }

        function renderSSL(ssl) {
            if (!Object.keys(ssl).length) return '<p class="no-data">No SSL data available.</p>';
            if (ssl.error) return `<p style="color:var(--danger);font-family:var(--font-mono);">SSL Error: ${escapeHtml(ssl.error)}</p>`;
            let html = '<div class="ssl-grid">';
            const items = [
                ['Status', ssl.valid ? '✓ Valid' : '✗ Invalid', ssl.valid ? 'var(--primary)' : 'var(--danger)'],
                ['Days Left', String(ssl.days_remaining || 'N/A'), ssl.days_remaining > 30 ? 'var(--primary)' : 'var(--danger)'],
                ['Expires', ssl.expires || 'N/A', '#fff'],
                ['Issued', ssl.issued || 'N/A', '#fff'],
                ['Issuer', ssl.issuer || 'N/A', '#fff'],
                ['Subject', ssl.subject || 'N/A', '#fff'],
                ['Protocol', ssl.protocol || 'N/A', 'var(--primary)'],
                ['Old TLS', ssl.deprecated_tls ? 'YES ⚠' : 'No', ssl.deprecated_tls ? 'var(--danger)' : 'var(--primary)'],
            ];
            for (const [label, value, color] of items) {
                html += `<div class="ssl-item"><div class="label">${label}</div><div class="value" style="color:${color}">${value}</div></div>`;
            }
            html += '</div>';
            if (ssl.sans && ssl.sans.length) {
                html += `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font-mono);">SUBJECT ALT NAMES</div><div style="font-size:11px;color:var(--text);word-break:break-all;font-family:var(--font-mono);">${ssl.sans.join(', ')}</div></div>`;
            }
            return html;
        }

        function renderEmails(emails) {
            if (!emails.length) return '<p class="no-data">No email addresses found in page source.</p>';
            let html = '<ul class="detail-list">';
            for (const e of emails) {
                html += `<li>✉️ <span style="flex:1;min-width:0;color:var(--primary);">${escapeHtml(e)}</span><button class="copy-btn" onclick="copyToClipboard('${escapeHtml(e)}', this)">📋 COPY</button></li>`;
            }
            html += '</ul>';
            return html;
        }

        function renderForms(forms) {
            if (!forms.length) return '<p class="no-data">No HTML forms found on the page.</p>';
            let html = '';
            for (const f of forms) {
                html += `<div class="form-card">
                    <div class="form-meta">Form #${f.index} • Method: <strong style="color:#fff;">${f.method}</strong> • Action: <code style="color:var(--secondary);">${escapeHtml(f.action || '(same page)')}</code> • ${f.input_count} inputs ${f.has_password ? '🔑' : ''}</div>`;
                if (f.issues && f.issues.length) {
                    for (const issue of f.issues) {
                        html += `<div class="form-issue">⚠ ${escapeHtml(issue)}</div>`;
                    }
                } else {
                    html += '<div style="color:var(--primary);font-size:12px;font-family:var(--font-mono);">✓ No issues detected</div>';
                }
                html += '</div>';
            }
            return html;
        }

        function renderPorts(ports) {
            if (!ports.length) return '<p class="no-data">No open ports detected (scanned 21 common ports).</p>';
            let html = '<div class="port-badges">';
            const dangerousPorts = [21, 23, 445, 3306, 3389, 5432, 5900, 6379, 9200, 27017, 11211];
            for (const p of ports) {
                const isDangerous = dangerousPorts.includes(p.port);
                html += `<span class="port-badge ${isDangerous ? 'danger' : ''}">${p.port}/${p.service}</span>`;
            }
            html += '</div>';
            return html;
        }

        function renderSocial(social) {
            if (!Object.keys(social).length) return '<p class="no-data">No social media links found in page source.</p>';
            let html = '<ul class="detail-list">';
            for (const [platform, links] of Object.entries(social)) {
                for (const link of links) {
                    html += `<li>
                        <strong style="color:var(--primary);">${platform}:</strong>
                        <a href="${escapeHtml(link)}" target="_blank" style="color:var(--text);flex:1;min-width:0;word-break:break-all;text-decoration:none;font-family:var(--font-mono);font-size:12px;">${escapeHtml(link)}</a>
                        <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(link)}', this)">📋 COPY</button>
                    </li>`;
                }
            }
            html += '</ul>';
            return html;
        }

        function renderExternal(domains) {
            if (!domains.length) return '<p class="no-data">No external domains detected.</p>';
            let html = `<p style="color:var(--muted);font-size:12px;margin-bottom:10px;font-family:var(--font-mono);">${domains.length} external domains loading resources:</p>`;
            html += '<div class="tech-tags">';
            for (const d of domains) {
                html += `<span class="tech-tag" style="color:var(--text);border-color:var(--border);">${escapeHtml(d)}</span>`;
            }
            html += '</div>';
            return html;
        }

        function renderJS(jsFiles) {
            if (!jsFiles.length) return '<p class="no-data">No external JavaScript files detected.</p>';
            let html = '<ul class="detail-list">';
            for (const js of jsFiles) {
                let issues = '';
                if (js.issues && js.issues.length) {
                    issues = ` <span style="color:var(--danger);">(${js.issues.join(', ')})</span>`;
                }
                const icon = js.external ? '🌐' : '📄';
                html += `<li>${icon} <span style="flex:1;min-width:0;word-break:break-all;color:var(--text);font-size:12px;">${escapeHtml(js.src)}</span>${issues}<button class="copy-btn" onclick="copyToClipboard('${escapeHtml(js.src)}', this)">📋 COPY</button></li>`;
            }
            html += '</ul>';
            return html;
        }

        function downloadReport(type) {
            if (!currentScanId) return;
            if (type === 'pdf') {
                window.open('/report/' + currentScanId + '/pdf', '_blank');
                showToast('⬇ Generating PDF report...');
            } else if (type === 'html') {
                window.open('/report/' + currentScanId, '_blank');
                showToast('⬇ Opening HTML report...');
            }
        }
    </script>
</body>
</html>
