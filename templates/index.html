<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>VULNSCAN - Web Security Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #111;
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 14px 20px;
            color: #00ff88;
            font-size: 14px;
            z-index: 10000;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.15);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* Sticky Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #1a1a3a;
            padding: 16px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 42px;
            color: #00ff88;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            margin-bottom: 4px;
        }
        .header p {
            color: #666;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
            padding-bottom: 80px;
        }

        /* Scan Box */
        .scan-box {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }
        .url-input {
            flex: 1;
            background: #0a0a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 16px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
            font-family: monospace;
            min-width: 0;
        }
        .url-input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }
        .url-input::placeholder { color: #444; }
        .scan-btn {
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .scan-btn:hover {
            background: #00cc6a;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }
        .scan-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Progress Section */
        .progress-section { display: none; margin-bottom: 24px; }
        .progress-bar-container {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 12px;
            padding: 20px;
        }
        .progress-text {
            text-align: center;
            color: #00ff88;
            margin-bottom: 12px;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .progress-bar {
            height: 4px;
            background: #1a1a3a;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .scanner-animation { text-align: center; margin: 12px 0; }
        .scanner-dots span {
            display: inline-block;
            width: 8px; height: 8px;
            margin: 0 4px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out;
        }
        .scanner-dots span:nth-child(2) { animation-delay: 0.2s; }
        .scanner-dots span:nth-child(3) { animation-delay: 0.4s; }
        .scanner-dots span:nth-child(4) { animation-delay: 0.6s; }
        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Loading Skeleton */
        .skeleton-container { display: none; margin-bottom: 24px; }
        .skeleton-container.show { display: block; }
        .skeleton {
            background: linear-gradient(90deg, #111 25%, #1a1a2a 50%, #111 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .skeleton-card { height: 80px; }
        .skeleton-row { height: 20px; width: 80%; }
        .skeleton-row-short { height: 20px; width: 50%; }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Results Section */
        .results-section {
            display: none;
            animation: fadeInUp 0.5s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .summary-card {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 10px;
            padding: 18px 12px;
            text-align: center;
            transition: border-color 0.3s;
        }
        .summary-card:hover { border-color: #333; }
        .summary-card .num {
            font-size: 28px;
            font-weight: bold;
        }
        .summary-card .lbl {
            font-size: 10px;
            text-transform: uppercase;
            color: #666;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Risk Banner */
        .risk-banner {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 10px;
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .risk-badge {
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .scan-meta { color: #555; font-size: 12px; }

        /* Actions Bar */
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #1a1a3a;
            border: 1px solid #333;
            color: #00ff88;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn:hover {
            background: #222;
            border-color: #00ff88;
        }
        .action-btn.primary {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
            font-weight: bold;
        }
        .action-btn.primary:hover { background: #00cc6a; }

        /* Accordion Sections */
        .section-accordion {
            margin-bottom: 10px;
            border: 1px solid #1a1a3a;
            border-radius: 10px;
            overflow: hidden;
        }
        .section-header {
            background: #111;
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .section-header:hover { background: #1a1a2a; }
        .section-header:active { background: #151530; }
        .section-header h3 {
            font-size: 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .section-header .badge {
            background: #1a1a3a;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #00ff88;
        }
        .section-header .arrow {
            transition: transform 0.3s;
            color: #555;
            flex-shrink: 0;
        }
        .section-header.open .arrow { transform: rotate(180deg); }
        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: #0a0a1a;
            border-top: 1px solid transparent;
        }
        .section-content.open {
            max-height: 5000px;
            border-top-color: #1a1a3a;
        }
        .section-content-inner {
            padding: 16px 18px;
        }

        /* Headers Table */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 6px;
        }
        .headers-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        .headers-table th, .headers-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #1a1a3a;
            font-size: 13px;
        }
        .headers-table th {
            color: #888;
            font-weight: normal;
            text-transform: uppercase;
            font-size: 11px;
            position: sticky;
            top: 0;
            background: #0a0a1a;
        }
        .check-icon { color: #00ff88; font-size: 18px; }
        .cross-icon { color: #ff4444; font-size: 18px; }

        /* Tags */
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tech-tag {
            background: #1a1a3a;
            border: 1px solid #333;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #00ff88;
        }

        /* Lists */
        .detail-list { list-style: none; }
        .detail-list li {
            padding: 8px 0;
            border-bottom: 1px solid #1a1a3a;
            font-size: 13px;
            color: #ccc;
            font-family: monospace;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .detail-list li:last-child { border-bottom: none; }

        /* Copy Button */
        .copy-btn {
            background: none;
            border: 1px solid #333;
            color: #666;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .copy-btn:hover { border-color: #00ff88; color: #00ff88; }
        .copy-btn.copied { border-color: #00ff88; color: #00ff88; }

        /* SSL Info */
        .ssl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .ssl-item {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 8px;
            padding: 12px;
        }
        .ssl-item .label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .ssl-item .value {
            font-size: 13px;
            color: #fff;
            font-family: monospace;
            word-break: break-all;
        }

        /* Info Grid - for new modules */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .info-item {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 8px;
            padding: 12px;
        }
        .info-item .label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .info-item .value {
            font-size: 13px;
            color: #fff;
            font-family: monospace;
            word-break: break-all;
        }
        .info-item .value.good { color: #00ff88; }
        .info-item .value.warn { color: #ffaa00; }
        .info-item .value.bad { color: #ff4444; }

        /* Forms */
        .form-card {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .form-card .form-meta {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            word-break: break-all;
        }
        .form-issue {
            color: #ff4444;
            font-size: 12px;
            padding: 2px 0;
        }

        /* Port badges */
        .port-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .port-badge {
            background: #1a1a3a;
            border: 1px solid #00ff88;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: #00ff88;
            font-family: monospace;
        }
        .port-badge.danger {
            border-color: #ff4444;
            color: #ff4444;
        }

        /* Findings */
        .findings-list { display: flex; flex-direction: column; gap: 12px; }
        .finding-card {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 10px;
            padding: 16px;
            transition: border-color 0.3s;
        }
        .finding-card:hover { border-color: #333; }
        .finding-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .sev-badge {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sev-critical { background: #ff0040; }
        .sev-high { background: #ff4444; }
        .sev-medium { background: #ffaa00; color: #000; }
        .sev-low { background: #00ccff; color: #000; }
        .sev-info { background: #444; }
        .cvss-tag {
            background: #1a1a3a;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #888;
            font-family: monospace;
        }
        .category-tag {
            font-size: 11px;
            color: #00ff88;
            background: #0a2a1a;
            padding: 2px 8px;
            border-radius: 3px;
        }
        .finding-title { font-size: 14px; color: #fff; margin-bottom: 6px; }
        .finding-desc { font-size: 13px; color: #999; margin-bottom: 10px; line-height: 1.5; word-break: break-word; }
        .finding-fix {
            background: #0a0a1a;
            border-left: 3px solid #ffaa00;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #ccc;
            word-break: break-word;
        }
        .finding-fix strong { color: #ffaa00; }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #333;
            font-size: 12px;
        }
        .no-data { color: #555; font-style: italic; font-size: 13px; padding: 10px 0; }

        /* Sticky Download Button */
        .sticky-download {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid #1a1a3a;
            padding: 12px 20px;
            display: none;
            justify-content: center;
            gap: 10px;
            z-index: 1000;
        }
        .sticky-download.show {
            display: flex;
        }
        .sticky-download .action-btn {
            font-size: 13px;
            padding: 12px 20px;
        }

        /* Scan Another Button */
        .scan-another-box {
            display: none;
            text-align: center;
            margin: 24px 0;
            padding: 20px;
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 12px;
        }
        .scan-another-box.show { display: block; }
        .scan-another-btn {
            background: transparent;
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .scan-another-btn:hover {
            background: #00ff88;
            color: #000;
        }

        /* Subdomain list */
        .subdomain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 8px;
        }
        .subdomain-item {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .subdomain-item .sub-name { color: #00ff88; }
        .subdomain-item .sub-ip { color: #666; }

        /* Social presence */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .social-item {
            background: #111;
            border: 1px solid #1a1a3a;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .social-item .platform { color: #fff; font-weight: bold; text-transform: capitalize; font-size: 13px; }
        .social-item .status-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }
        .social-item .status-dot.found { background: #00ff88; }
        .social-item .status-dot.not-found { background: #ff4444; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .summary-cards { grid-template-columns: repeat(3, 1fr); }
            .ssl-grid { grid-template-columns: repeat(2, 1fr); }
            .info-grid { grid-template-columns: repeat(2, 1fr); }
            .skeleton-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 32px; letter-spacing: 3px; }
            .header p { font-size: 10px; letter-spacing: 1px; }
            .header { padding: 12px 16px; }
            .container { padding: 16px 12px; padding-bottom: 80px; }
            .scan-box { padding: 16px; }
            .input-group { flex-direction: column; }
            .scan-btn { width: 100%; padding: 14px; }
            .url-input { padding: 14px; font-size: 14px; }
            .summary-cards { grid-template-columns: 1fr 1fr; gap: 8px; }
            .summary-card { padding: 14px 8px; }
            .summary-card .num { font-size: 24px; }
            .summary-card .lbl { font-size: 9px; }
            .risk-banner { flex-direction: column; align-items: flex-start; padding: 12px 16px; }
            .actions-bar { flex-direction: column; }
            .action-btn { width: 100%; justify-content: center; padding: 12px; }
            .section-header { padding: 12px 14px; }
            .section-header h3 { font-size: 13px; gap: 6px; }
            .section-content-inner { padding: 12px 14px; }
            .finding-card { padding: 14px; }
            .finding-title { font-size: 13px; }
            .finding-desc { font-size: 12px; }
            .ssl-grid { grid-template-columns: 1fr; }
            .info-grid { grid-template-columns: 1fr; }
            .skeleton-grid { grid-template-columns: 1fr 1fr; }
            .toast { right: 12px; left: 12px; top: 12px; }
            .progress-bar-container { padding: 16px; }
            .sticky-download { padding: 10px 12px; }
            .sticky-download .action-btn { font-size: 12px; padding: 10px 14px; flex: 1; }
            .subdomain-grid { grid-template-columns: 1fr; }
            .social-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 400px) {
            .header h1 { font-size: 26px; letter-spacing: 2px; }
            .summary-cards { grid-template-columns: 1fr 1fr; }
            .summary-card .num { font-size: 20px; }
            .container { padding: 12px 8px; padding-bottom: 80px; }
            .scan-box { padding: 12px; border-radius: 8px; }
        }
    </style>
</head>
<body>
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Sticky Header -->
    <div class="header">
        <h1>VULNSCAN</h1>
        <p>Web Security Scanner &bull; 24 Modules &bull; 150+ Checks</p>
    </div>

    <div class="container">
        <!-- Scan Input -->
        <div class="scan-box">
            <div class="input-group">
                <input type="text" class="url-input" id="urlInput"
                       placeholder="https://example.com"
                       autocomplete="off" spellcheck="false">
                <button class="scan-btn" id="scanBtn" onclick="startScan()">SCAN</button>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section" id="progressSection">
            <div class="progress-bar-container">
                <div class="progress-text" id="progressText">Initializing scan...</div>
                <div class="scanner-animation">
                    <div class="scanner-dots">
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <!-- Loading Skeleton -->
        <div class="skeleton-container" id="skeletonContainer">
            <div class="skeleton-grid">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="skeleton skeleton-row" style="margin-bottom:16px;"></div>
            <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
            <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
            <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
        </div>

        <!-- Results -->
        <div class="results-section" id="resultsSection">
            <div class="summary-cards" id="summaryCards"></div>
            <div class="risk-banner" id="riskBanner"></div>
            <div class="actions-bar" id="actionsBar"></div>
            <div id="detailSections"></div>
            <div class="section-accordion">
                <div class="section-header" onclick="toggleSection(this)">
                    <h3>&#128270; All Findings <span class="badge" id="findingsCount">0</span></h3>
                    <span class="arrow">&#9660;</span>
                </div>
                <div class="section-content">
                    <div class="section-content-inner">
                        <div class="findings-list" id="findingsList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scan Another -->
        <div class="scan-another-box" id="scanAnotherBox">
            <button class="scan-another-btn" onclick="scanAnother()">&#128260; Scan Another Target</button>
        </div>

        <div class="footer">
            <p>VULNSCAN &mdash; Passive Reconnaissance Only &mdash; No Active Exploitation</p>
            <p>github.com/DAXXTEAM/VULNSCAN</p>
        </div>
    </div>

    <!-- Sticky Download Bar -->
    <div class="sticky-download" id="stickyDownload">
        <button class="action-btn primary" id="stickyDownloadBtn" onclick="downloadCurrentReport()">&#11015; Download Report</button>
        <button class="action-btn" onclick="scanAnother()">&#128260; Scan Another</button>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        let currentScanId = '';

        urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startScan(); });

        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function toggleSection(el) {
            el.classList.toggle('open');
            const content = el.nextElementSibling;
            content.classList.toggle('open');
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✓';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✓';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            });
        }

        function scanAnother() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('scanAnotherBox').classList.remove('show');
            document.getElementById('stickyDownload').classList.remove('show');
            urlInput.value = '';
            urlInput.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function startScan() {
            const url = urlInput.value.trim();
            if (!url) {
                urlInput.style.borderColor = '#ff0055';
                urlInput.focus();
                setTimeout(() => urlInput.style.borderColor = '#333', 2000);
                return;
            }

            showToast('🚀 Scan initiated for ' + url);

            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = true;
            scanBtn.textContent = 'SCANNING...';
            document.getElementById('progressSection').style.display = 'block';
            document.getElementById('skeletonContainer').classList.add('show');
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('scanAnotherBox').classList.remove('show');
            document.getElementById('stickyDownload').classList.remove('show');

            const steps = [
                'Resolving target & WHOIS...', 'Checking SSL/TLS certificates...',
                'Analyzing security headers...', 'Detecting technology stack & CMS...',
                'Scanning 100+ exposed file paths...', 'Querying DNS records...',
                'Checking robots.txt...', 'Analyzing cookies & CORS...',
                'Port scanning (21 ports)...', 'Harvesting emails...',
                'Enumerating subdomains...', 'Analyzing page content...',
                'Checking performance & CDN...', 'Verifying email security (SPF/DMARC)...',
                'Testing HTTP methods...', 'Checking social media presence...',
                'Querying Wayback Machine...', 'IP geolocation lookup...',
                'Analyzing JavaScript files...', 'Checking external resources...',
                'Analyzing forms...', 'Finalizing comprehensive report...'
            ];

            let step = 0;
            const progressInterval = setInterval(() => {
                if (step < steps.length) {
                    document.getElementById('progressText').textContent = steps[step];
                    document.getElementById('progressFill').style.width = ((step + 1) / steps.length * 90) + '%';
                    step++;
                }
            }, 2500);

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                clearInterval(progressInterval);
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('progressText').textContent = 'Scan complete!';

                const data = await response.json();

                if (data.status === 'running') {
                    await pollForResults(data.scan_id);
                } else if (data.error && !data.findings) {
                    showError(data.error);
                } else {
                    setTimeout(() => renderResults(data), 400);
                }
            } catch (err) {
                clearInterval(progressInterval);
                showError('Network error: ' + err.message);
            }

            scanBtn.disabled = false;
            scanBtn.textContent = 'SCAN';
            document.getElementById('skeletonContainer').classList.remove('show');
        }

        async function pollForResults(scanId) {
            for (let i = 0; i < 60; i++) {
                await new Promise(r => setTimeout(r, 2000));
                const resp = await fetch(`/scan/${scanId}/status`);
                const data = await resp.json();
                if (data.status === 'complete') {
                    renderResults(data.result);
                    return;
                }
                if (data.status === 'error') {
                    showError('Scan failed');
                    return;
                }
            }
            showError('Scan timed out');
        }

        function showError(msg) {
            document.getElementById('progressSection').style.display = 'none';
            document.getElementById('skeletonContainer').classList.remove('show');
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('summaryCards').innerHTML = '';
            document.getElementById('riskBanner').innerHTML = `<span style="color:#ff0055">&#9888; Error: ${msg}</span>`;
            document.getElementById('detailSections').innerHTML = '';
            document.getElementById('findingsList').innerHTML = '';
            document.getElementById('actionsBar').innerHTML = '';
            document.getElementById('scanAnotherBox').classList.add('show');
            showToast('❌ ' + msg, 4000);
        }

        function getRiskColor(level) {
            const colors = { CRITICAL: '#ff0040', HIGH: '#ff4444', MEDIUM: '#ffaa00', LOW: '#00ccff', INFORMATIONAL: '#888' };
            return colors[level] || '#888';
        }

        function renderResults(data) {
            document.getElementById('progressSection').style.display = 'none';
            document.getElementById('skeletonContainer').classList.remove('show');
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('scanAnotherBox').classList.add('show');
            document.getElementById('stickyDownload').classList.add('show');

            currentScanId = data.scan_id;
            showToast('✅ Scan complete! ' + data.total_findings + ' findings (' + (data.modules_count || 24) + ' modules)');

            const riskColor = getRiskColor(data.risk_level);
            document.getElementById('summaryCards').innerHTML = `
                <div class="summary-card"><div class="num" style="color:#ff0040">${data.stats.critical}</div><div class="lbl">Critical</div></div>
                <div class="summary-card"><div class="num" style="color:#ff4444">${data.stats.high}</div><div class="lbl">High</div></div>
                <div class="summary-card"><div class="num" style="color:#ffaa00">${data.stats.medium}</div><div class="lbl">Medium</div></div>
                <div class="summary-card"><div class="num" style="color:#00ccff">${data.stats.low}</div><div class="lbl">Low</div></div>
                <div class="summary-card"><div class="num" style="color:#888">${data.stats.info}</div><div class="lbl">Info</div></div>
            `;

            document.getElementById('riskBanner').innerHTML = `
                <div>
                    <span class="risk-badge" style="background:${riskColor};color:#fff">${data.risk_level}</span>
                    <span style="margin-left:12px;color:#888;">Max CVSS: ${data.max_cvss} | ${data.modules_count || 24} modules</span>
                </div>
                <div class="scan-meta">
                    ${data.total_findings} findings &bull; ${data.duration_seconds}s &bull; ${data.paths_checked || '100+'} paths checked
                </div>
            `;

            document.getElementById('actionsBar').innerHTML = `
                <a class="action-btn" href="/report/${data.scan_id}" target="_blank">&#128196; HTML Report</a>
                <a class="action-btn" href="/report/${data.scan_id}/json" target="_blank">&#128190; JSON Export</a>
                <a class="action-btn" href="/scan/${data.scan_id}/details" target="_blank">&#128203; Full Details</a>
                <button class="action-btn primary" onclick="downloadReport('${data.scan_id}')">&#11015; Download Report</button>
            `;

            let sections = '';
            const details = data.details || {};

            // Domain Intelligence (WHOIS)
            const whois = details.whois_detail || {};
            sections += buildAccordion('&#127760; Domain Intelligence', whois.registrar ? whois.registrar : '', renderWhois(whois));

            // IP & Location
            const geo = details.geo_detail || {};
            sections += buildAccordion('&#128205; IP & Location', geo.ip || '', renderGeo(geo));

            // Open Ports (enhanced)
            const ports = details.open_ports || [];
            sections += buildAccordion('&#128268; Open Ports', `${ports.length} open`, renderPorts(ports));

            // Subdomains
            const subdomains = details.subdomains || [];
            sections += buildAccordion('&#128269; Subdomains', `${subdomains.length} found`, renderSubdomains(subdomains));

            // Content Analysis
            const content = details.content_detail || {};
            sections += buildAccordion('&#128196; Content Analysis', content.title ? `"${content.title.substring(0, 40)}..."` : '', renderContent(content));

            // Performance
            const perf = details.performance_detail || {};
            sections += buildAccordion('&#9889; Performance', perf.load_time_seconds ? `${perf.load_time_seconds}s` : '', renderPerformance(perf));

            // Email Security
            const emailSec = details.email_security || {};
            sections += buildAccordion('&#128231; Email Security', '', renderEmailSecurity(emailSec));

            // Archive History
            const wayback = details.wayback_detail || {};
            sections += buildAccordion('&#128218; Archive History', wayback.available ? 'Archived' : 'Not found', renderWayback(wayback));

            // Social Presence
            const socialPresence = details.social_presence || {};
            const presenceCount = Object.values(socialPresence).filter(v => v.exists).length;
            sections += buildAccordion('&#128100; Social Presence', `${presenceCount}/${Object.keys(socialPresence).length}`, renderSocialPresence(socialPresence));

            // HTTP Methods
            const httpMethods = details.http_methods || [];
            sections += buildAccordion('&#128295; HTTP Methods', httpMethods.length ? `${httpMethods.length} allowed` : 'Restricted', renderHTTPMethods(httpMethods));

            // Exposed Files
            const exposedFiles = details.exposed_files || [];
            const exposed200 = exposedFiles.filter(f => f.status === 200);
            const exposed403 = exposedFiles.filter(f => f.status === 403);
            sections += buildAccordion('&#128194; Exposed Files', `${exposed200.length} accessible, ${exposed403.length} forbidden`, renderExposedFiles(exposed200, exposed403));

            // Security Headers
            sections += buildAccordion('&#128737; Security Headers', '', renderHeadersTable(details.headers_detail || {}));

            // Technology Stack
            const techList = details.tech_list || [];
            sections += buildAccordion('&#9881; Technology Stack', `${techList.length} detected`, renderTechStack(techList, details.tech_detail || {}));

            // SSL/TLS
            sections += buildAccordion('&#128274; SSL/TLS Certificate', '', renderSSL(details.ssl_detail || {}));

            // Emails Found
            const emails = details.emails || [];
            sections += buildAccordion('&#128231; Emails Harvested', `${emails.length}`, renderEmails(emails));

            // Form Analysis
            const forms = details.forms || [];
            sections += buildAccordion('&#128221; Form Analysis', `${forms.length} forms`, renderForms(forms));

            // Social Media Links (from page)
            const social = details.social_links || {};
            const socialCount = Object.keys(social).length;
            sections += buildAccordion('&#127760; Social Media Links', `${socialCount} platforms`, renderSocial(social));

            // External Resources
            const extDomains = details.external_domains || [];
            sections += buildAccordion('&#128279; External Resources', `${extDomains.length} domains`, renderExternal(extDomains));

            // JavaScript
            const jsFiles = details.javascript || [];
            sections += buildAccordion('&#128220; JavaScript Files', `${jsFiles.length} scripts`, renderJS(jsFiles));

            document.getElementById('detailSections').innerHTML = sections;

            document.getElementById('findingsCount').textContent = data.total_findings;
            let html = '';
            for (const f of data.findings) {
                html += `
                <div class="finding-card">
                    <div class="finding-top">
                        <span class="sev-badge sev-${f.severity}">${f.severity}</span>
                        <span class="cvss-tag">CVSS ${f.cvss_score}</span>
                        <span class="category-tag">${f.category || ''}</span>
                    </div>
                    <div class="finding-title">${escapeHtml(f.title)}</div>
                    <div class="finding-desc">${escapeHtml(f.description)}</div>
                    <div class="finding-fix"><strong>Fix:</strong> ${escapeHtml(f.recommendation)}</div>
                </div>`;
            }
            document.getElementById('findingsList').innerHTML = html;

            setTimeout(() => {
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function buildAccordion(title, badge, content) {
            return `
            <div class="section-accordion">
                <div class="section-header" onclick="toggleSection(this)">
                    <h3>${title} ${badge ? `<span class="badge">${escapeHtml(badge)}</span>` : ''}</h3>
                    <span class="arrow">&#9660;</span>
                </div>
                <div class="section-content">
                    <div class="section-content-inner">${content}</div>
                </div>
            </div>`;
        }

        // ===== NEW RENDER FUNCTIONS =====

        function renderWhois(whois) {
            if (!Object.keys(whois).length || whois.registrar === 'N/A' && !whois.created) return '<p class="no-data">WHOIS data not available for this domain.</p>';
            let html = '<div class="info-grid">';
            const items = [
                ['Registrar', whois.registrar || 'N/A'],
                ['Created', whois.created || 'N/A'],
                ['Expires', whois.expires || 'N/A'],
                ['Updated', whois.updated || 'N/A'],
                ['Domain Age', whois.domain_age || 'N/A'],
                ['Days to Expire', whois.days_to_expire !== undefined ? String(whois.days_to_expire) : 'N/A'],
                ['Organization', whois.org || 'N/A'],
                ['Country', whois.country || 'N/A'],
            ];
            for (const [label, value] of items) {
                let cls = '';
                if (label === 'Days to Expire') {
                    const d = parseInt(value);
                    if (!isNaN(d)) cls = d < 30 ? 'bad' : d < 90 ? 'warn' : 'good';
                }
                html += `<div class="info-item"><div class="label">${label}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            if (whois.name_servers && whois.name_servers.length) {
                html += `<div style="margin-top:12px;"><strong style="color:#666;font-size:11px;">NAME SERVERS:</strong><div style="margin-top:4px;font-size:12px;color:#888;">${whois.name_servers.join(', ')}</div></div>`;
            }
            return html;
        }

        function renderGeo(geo) {
            if (!geo.ip) return '<p class="no-data">IP geolocation data not available.</p>';
            let html = '<div class="info-grid">';
            const items = [
                ['IP Address', geo.ip],
                ['Country', geo.country || 'N/A'],
                ['Region', geo.region || 'N/A'],
                ['City', geo.city || 'N/A'],
                ['ISP', geo.isp || 'N/A'],
                ['Organization', geo.org || 'N/A'],
                ['AS Number', geo.as || 'N/A'],
                ['Coordinates', geo.lat && geo.lon ? `${geo.lat}, ${geo.lon}` : 'N/A'],
            ];
            for (const [label, value] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value">${escapeHtml(String(value))}</div></div>`;
            }
            html += '</div>';
            return html;
        }

        function renderSubdomains(subdomains) {
            if (!subdomains.length) return '<p class="no-data">No subdomains found from common prefixes scan.</p>';
            let html = `<p style="color:#888;font-size:12px;margin-bottom:12px;">${subdomains.length} subdomains discovered:</p>`;
            html += '<div class="subdomain-grid">';
            for (const s of subdomains) {
                html += `<div class="subdomain-item"><span class="sub-name">${escapeHtml(s.subdomain)}</span><span class="sub-ip">${escapeHtml(s.ip)}</span></div>`;
            }
            html += '</div>';
            return html;
        }

        function renderContent(content) {
            if (!Object.keys(content).length) return '<p class="no-data">Content analysis data not available.</p>';
            let html = '<div class="info-grid">';
            const items = [
                ['Title', content.title || '(No title)'],
                ['Word Count', String(content.word_count || 0)],
                ['Page Size', `${content.page_size_kb || 0} KB`],
                ['Total Links', String(content.total_links || 0)],
                ['Internal Links', String(content.internal_links || 0)],
                ['External Links', String(content.external_links || 0)],
                ['Images', String(content.images || 0)],
                ['Scripts', String(content.scripts || 0)],
            ];
            for (const [label, value] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            if (content.meta_description) {
                html += `<div style="margin-top:12px;"><strong style="color:#666;font-size:11px;">META DESCRIPTION:</strong><div style="margin-top:4px;font-size:12px;color:#999;">${escapeHtml(content.meta_description)}</div></div>`;
            }
            if (content.h1_tags && content.h1_tags.length) {
                html += `<div style="margin-top:10px;"><strong style="color:#666;font-size:11px;">H1 TAGS:</strong><div style="margin-top:4px;font-size:12px;color:#888;">${content.h1_tags.map(h => escapeHtml(h)).join(' | ')}</div></div>`;
            }
            if (content.contact_emails && content.contact_emails.length) {
                html += `<div style="margin-top:10px;"><strong style="color:#666;font-size:11px;">CONTACT EMAILS:</strong><div style="margin-top:4px;font-size:12px;color:#00ff88;">${content.contact_emails.join(', ')}</div></div>`;
            }
            if (content.phone_numbers && content.phone_numbers.length) {
                html += `<div style="margin-top:10px;"><strong style="color:#666;font-size:11px;">PHONE NUMBERS:</strong><div style="margin-top:4px;font-size:12px;color:#00ff88;">${content.phone_numbers.join(', ')}</div></div>`;
            }
            return html;
        }

        function renderPerformance(perf) {
            if (!Object.keys(perf).length) return '<p class="no-data">Performance data not available.</p>';
            let timeClass = perf.load_time_seconds < 2 ? 'good' : perf.load_time_seconds < 5 ? 'warn' : 'bad';
            let html = '<div class="info-grid">';
            const items = [
                ['Load Time', `${perf.load_time_seconds}s`, timeClass],
                ['Response Size', `${perf.response_size_kb} KB`, ''],
                ['Status Code', String(perf.status_code || 'N/A'), perf.status_code === 200 ? 'good' : 'warn'],
                ['CDN Detected', perf.cdn_detected ? `Yes (${perf.cdn_provider || 'Unknown'})` : 'No', perf.cdn_detected ? 'good' : ''],
                ['Cache Control', perf.cache_control || 'None', perf.cache_control && perf.cache_control !== 'None' ? 'good' : 'warn'],
                ['Compression', perf.content_encoding || 'None', perf.content_encoding && perf.content_encoding !== 'None' ? 'good' : 'warn'],
            ];
            for (const [label, value, cls] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            return html;
        }

        function renderEmailSecurity(emailSec) {
            if (!Object.keys(emailSec).length) return '<p class="no-data">Email security data not available.</p>';
            let html = '<div class="info-grid">';
            const spfStatus = emailSec.spf ? 'Configured' : 'Missing';
            const dmarcStatus = emailSec.dmarc ? 'Configured' : 'Missing';
            const items = [
                ['SPF Record', spfStatus, emailSec.spf ? 'good' : 'bad'],
                ['DMARC Record', dmarcStatus, emailSec.dmarc ? 'good' : 'bad'],
                ['MX Records', emailSec.mx_records ? `${emailSec.mx_records.length} found` : 'None', emailSec.mx_records && emailSec.mx_records.length ? 'good' : ''],
            ];
            for (const [label, value, cls] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            if (emailSec.spf) {
                html += `<div style="margin-top:12px;"><strong style="color:#666;font-size:11px;">SPF:</strong><div style="margin-top:4px;font-size:11px;color:#00ff88;font-family:monospace;word-break:break-all;">${escapeHtml(emailSec.spf)}</div></div>`;
            }
            if (emailSec.dmarc) {
                html += `<div style="margin-top:10px;"><strong style="color:#666;font-size:11px;">DMARC:</strong><div style="margin-top:4px;font-size:11px;color:#00ff88;font-family:monospace;word-break:break-all;">${escapeHtml(emailSec.dmarc)}</div></div>`;
            }
            if (emailSec.mx_records && emailSec.mx_records.length) {
                html += `<div style="margin-top:10px;"><strong style="color:#666;font-size:11px;">MX RECORDS:</strong><div style="margin-top:4px;font-size:11px;color:#888;font-family:monospace;">${emailSec.mx_records.join('<br>')}</div></div>`;
            }
            return html;
        }

        function renderWayback(wayback) {
            if (!Object.keys(wayback).length) return '<p class="no-data">Wayback Machine data not available.</p>';
            if (!wayback.available) return '<p class="no-data">No archived snapshots found on the Wayback Machine.</p>';
            let ts = wayback.timestamp || '';
            let formatted = ts.length >= 8 ? `${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)}` : ts;
            let html = '<div class="info-grid">';
            html += `<div class="info-item"><div class="label">Status</div><div class="value good">Archived</div></div>`;
            html += `<div class="info-item"><div class="label">Last Snapshot</div><div class="value">${escapeHtml(formatted)}</div></div>`;
            html += '</div>';
            if (wayback.url) {
                html += `<div style="margin-top:12px;"><a href="${escapeHtml(wayback.url)}" target="_blank" style="color:#00ff88;font-size:12px;">View on Wayback Machine →</a></div>`;
            }
            return html;
        }

        function renderSocialPresence(presence) {
            if (!Object.keys(presence).length) return '<p class="no-data">Social media presence check not available.</p>';
            let html = '<div class="social-grid">';
            for (const [platform, info] of Object.entries(presence)) {
                const dotClass = info.exists ? 'found' : 'not-found';
                const statusText = info.exists ? 'Found' : 'Not found';
                html += `<div class="social-item">
                    <span class="status-dot ${dotClass}"></span>
                    <div>
                        <div class="platform">${platform}</div>
                        <div style="font-size:11px;color:#666;">${statusText}</div>
                    </div>
                    ${info.exists ? `<a href="${escapeHtml(info.url)}" target="_blank" style="color:#00ff88;font-size:11px;margin-left:auto;">Visit</a>` : ''}
                </div>`;
            }
            html += '</div>';
            return html;
        }

        function renderHTTPMethods(methods) {
            if (!methods.length) return '<p style="color:#00ff88;font-size:13px;">&#10004; All dangerous HTTP methods are properly restricted (TRACE, TRACK, PUT, DELETE, PATCH, OPTIONS return 405/501).</p>';
            let html = '<div class="port-badges">';
            for (const m of methods) {
                const isDangerous = ['TRACE', 'TRACK', 'PUT', 'DELETE'].includes(m.method);
                html += `<span class="port-badge ${isDangerous ? 'danger' : ''}">${m.method} (${m.status})</span>`;
            }
            html += '</div>';
            return html;
        }

        // ===== EXISTING RENDER FUNCTIONS =====

        function renderExposedFiles(exposed200, exposed403) {
            if (!exposed200.length && !exposed403.length) return '<p class="no-data">No exposed files found. All 100+ paths returned 404.</p>';
            let html = '';
            if (exposed200.length) {
                html += '<h4 style="color:#ff4444;margin-bottom:8px;">&#9888; Accessible (HTTP 200)</h4><ul class="detail-list">';
                for (const f of exposed200) {
                    html += `<li>
                        <span style="color:${f.severity==='high'?'#ff4444':'#ffaa00'}">[${f.severity.toUpperCase()}]</span>
                        <a href="${escapeHtml(f.url)}" target="_blank" style="color:#00ff88;flex:1;min-width:0;word-break:break-all;">${escapeHtml(f.path)}</a>
                        <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(f.url)}', this)">Copy</button>
                    </li>`;
                }
                html += '</ul>';
            }
            if (exposed403.length) {
                html += '<h4 style="color:#ffaa00;margin:16px 0 8px;">&#128274; Forbidden (HTTP 403)</h4><ul class="detail-list">';
                for (const f of exposed403) {
                    html += `<li style="color:#888;">${escapeHtml(f.path)}</li>`;
                }
                html += '</ul>';
            }
            return html;
        }

        function renderHeadersTable(headers) {
            if (!Object.keys(headers).length) return '<p class="no-data">No header data available.</p>';
            let html = '<div class="table-wrapper"><table class="headers-table"><tr><th>Header</th><th>Status</th><th>Expected</th><th>Actual</th></tr>';
            for (const [name, info] of Object.entries(headers)) {
                const icon = info.present ? '<span class="check-icon">&#10004;</span>' : '<span class="cross-icon">&#10008;</span>';
                html += `<tr>
                    <td style="color:#fff;font-weight:bold;">${name}</td>
                    <td>${icon}</td>
                    <td style="color:#666;font-family:monospace;font-size:11px;">${escapeHtml(info.expected || '')}</td>
                    <td style="color:${info.present ? '#00ff88' : '#ff4444'};font-family:monospace;font-size:11px;">${info.present ? escapeHtml(info.actual || 'Set') : 'Missing'}</td>
                </tr>`;
            }
            html += '</table></div>';
            return html;
        }

        function renderTechStack(techList, techDetail) {
            if (!techList.length && !Object.keys(techDetail).length) return '<p class="no-data">No technologies detected.</p>';
            let html = '<div class="tech-tags">';
            for (const t of techList) {
                html += `<span class="tech-tag">${escapeHtml(t)}</span>`;
            }
            html += '</div>';
            if (Object.keys(techDetail).length) {
                html += '<div style="margin-top:12px;font-size:12px;color:#888;">';
                for (const [key, val] of Object.entries(techDetail)) {
                    html += `<div><strong style="color:#666;">${key}:</strong> <span style="color:#ccc;">${escapeHtml(String(val))}</span></div>`;
                }
                html += '</div>';
            }
            return html;
        }

        function renderSSL(ssl) {
            if (!Object.keys(ssl).length) return '<p class="no-data">No SSL data available.</p>';
            if (ssl.error) return `<p style="color:#ff4444;">SSL Error: ${escapeHtml(ssl.error)}</p>`;
            let html = '<div class="ssl-grid">';
            const items = [
                ['Status', ssl.valid ? '&#10004; Valid' : '&#10008; Invalid', ssl.valid ? '#00ff88' : '#ff4444'],
                ['Days Left', String(ssl.days_remaining || 'N/A'), ssl.days_remaining > 30 ? '#00ff88' : '#ff4444'],
                ['Expires', ssl.expires || 'N/A', '#fff'],
                ['Issued', ssl.issued || 'N/A', '#fff'],
                ['Issuer', ssl.issuer || 'N/A', '#fff'],
                ['Subject', ssl.subject || 'N/A', '#fff'],
                ['Protocol', ssl.protocol || 'N/A', '#00ff88'],
                ['Old TLS', ssl.deprecated_tls ? 'YES &#9888;' : 'No', ssl.deprecated_tls ? '#ff4444' : '#00ff88'],
            ];
            for (const [label, value, color] of items) {
                html += `<div class="ssl-item"><div class="label">${label}</div><div class="value" style="color:${color}">${value}</div></div>`;
            }
            html += '</div>';
            if (ssl.sans && ssl.sans.length) {
                html += `<div style="margin-top:12px;"><strong style="color:#666;font-size:12px;">SANs:</strong><div style="font-size:12px;color:#888;margin-top:4px;word-break:break-all;">${ssl.sans.join(', ')}</div></div>`;
            }
            return html;
        }

        function renderEmails(emails) {
            if (!emails.length) return '<p class="no-data">No email addresses found in page source.</p>';
            let html = '<ul class="detail-list">';
            for (const e of emails) {
                html += `<li>&#128231; <span style="flex:1;min-width:0;">${escapeHtml(e)}</span><button class="copy-btn" onclick="copyToClipboard('${escapeHtml(e)}', this)">Copy</button></li>`;
            }
            html += '</ul>';
            return html;
        }

        function renderForms(forms) {
            if (!forms.length) return '<p class="no-data">No HTML forms found on the page.</p>';
            let html = '';
            for (const f of forms) {
                html += `<div class="form-card">
                    <div class="form-meta">Form #${f.index} &bull; Method: <strong>${f.method}</strong> &bull; Action: <code>${escapeHtml(f.action || '(same page)')}</code> &bull; ${f.input_count} inputs ${f.has_password ? '&#128273;' : ''}</div>`;
                if (f.issues && f.issues.length) {
                    for (const issue of f.issues) {
                        html += `<div class="form-issue">&#9888; ${escapeHtml(issue)}</div>`;
                    }
                } else {
                    html += '<div style="color:#00ff88;font-size:12px;">&#10004; No issues detected</div>';
                }
                html += '</div>';
            }
            return html;
        }

        function renderPorts(ports) {
            if (!ports.length) return '<p class="no-data">No open ports detected (scanned 21 common ports).</p>';
            let html = '<div class="port-badges">';
            const dangerousPorts = [21, 23, 445, 3306, 3389, 5432, 5900, 6379, 9200, 27017, 11211];
            for (const p of ports) {
                const isDangerous = dangerousPorts.includes(p.port);
                html += `<span class="port-badge ${isDangerous ? 'danger' : ''}">${p.port}/${p.service}</span>`;
            }
            html += '</div>';
            return html;
        }

        function renderSocial(social) {
            if (!Object.keys(social).length) return '<p class="no-data">No social media links found in page source.</p>';
            let html = '<ul class="detail-list">';
            for (const [platform, links] of Object.entries(social)) {
                for (const link of links) {
                    html += `<li>
                        <strong style="color:#00ff88;">${platform}:</strong>
                        <a href="${escapeHtml(link)}" target="_blank" style="color:#888;flex:1;min-width:0;word-break:break-all;">${escapeHtml(link)}</a>
                        <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(link)}', this)">Copy</button>
                    </li>`;
                }
            }
            html += '</ul>';
            return html;
        }

        function renderExternal(domains) {
            if (!domains.length) return '<p class="no-data">No external domains detected.</p>';
            let html = `<p style="color:#888;font-size:12px;margin-bottom:10px;">${domains.length} external domains loading resources:</p>`;
            html += '<div class="tech-tags">';
            for (const d of domains) {
                html += `<span class="tech-tag" style="color:#888;border-color:#333;">${escapeHtml(d)}</span>`;
            }
            html += '</div>';
            return html;
        }

        function renderJS(jsFiles) {
            if (!jsFiles.length) return '<p class="no-data">No external JavaScript files detected.</p>';
            let html = '<ul class="detail-list">';
            for (const js of jsFiles) {
                let issues = '';
                if (js.issues && js.issues.length) {
                    issues = ' <span style="color:#ff4444;">(' + js.issues.join(', ') + ')</span>';
                }
                const icon = js.external ? '&#127760;' : '&#128196;';
                html += `<li>${icon} <span style="flex:1;min-width:0;word-break:break-all;color:#ccc;">${escapeHtml(js.src)}</span>${issues}<button class="copy-btn" onclick="copyToClipboard('${escapeHtml(js.src)}', this)">Copy</button></li>`;
            }
            html += '</ul>';
            return html;
        }

        function downloadReport(scanId) {
            fetch(`/report/${scanId}/json`)
                .then(r => r.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `vulnscan-report-${scanId}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('📥 Report downloaded');
                });
        }

        function downloadCurrentReport() {
            if (currentScanId) downloadReport(currentScanId);
        }
    </script>
</body>
</html>
