<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>VULNSCAN - Advanced Web Security Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #050510;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0d0d1f;
            border: 1px solid #00ff88;
            border-radius: 12px;
            padding: 14px 20px;
            color: #00ff88;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            z-index: 10000;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: 0 4px 30px rgba(0, 255, 136, 0.15);
            backdrop-filter: blur(10px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* Sticky Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(5, 5, 16, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #1a1a3a;
            padding: 20px 20px;
            text-align: center;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 6px;
        }
        .header-shield {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 6px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.3));
        }
        .version-badge {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: #050510;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 1px;
            align-self: flex-start;
            margin-top: 8px;
        }
        .header p {
            color: #555;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
            padding-bottom: 100px;
        }

        /* Scan Box */
        .scan-box {
            background: #0d0d1f;
            border: 1px solid #1a1a3a;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .input-group {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }
        .url-input {
            flex: 1;
            background: #050510;
            border: 2px solid #1a1a3a;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 16px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'JetBrains Mono', monospace;
            min-width: 0;
        }
        .url-input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1), inset 0 0 10px rgba(0, 255, 136, 0.02);
        }
        .url-input.invalid {
            border-color: #ff3355;
            box-shadow: 0 0 15px rgba(255, 51, 85, 0.15);
        }
        .url-input::placeholder { color: #3a3a5a; }
        .scan-btn {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: #050510;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.35);
        }
        .scan-btn:disabled {
            background: #1a1a3a;
            color: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .scan-btn.scanning {
            animation: btnPulse 1.5s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(0, 255, 136, 0); }
        }
        .scan-btn-icon {
            width: 18px;
            height: 18px;
        }

        /* Quick Scan Options */
        .scan-options {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .scan-chip {
            background: transparent;
            border: 1px solid #1a1a3a;
            color: #666;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        .scan-chip:hover {
            border-color: #00ff88;
            color: #00ff88;
        }
        .scan-chip.active {
            background: rgba(0, 255, 136, 0.1);
            border-color: #00ff88;
            color: #00ff88;
            font-weight: 600;
        }

        /* Terminal Progress Section */
        .progress-section { display: none; margin-bottom: 28px; }
        .terminal-window {
            background: #0a0a14;
            border: 1px solid #1a1a3a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }
        .terminal-header {
            background: #111122;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #1a1a3a;
        }
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .terminal-dot.red { background: #ff3355; }
        .terminal-dot.yellow { background: #ffaa00; }
        .terminal-dot.green { background: #00ff88; }
        .terminal-title {
            color: #555;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            margin-left: 8px;
            letter-spacing: 1px;
        }
        .terminal-body {
            padding: 18px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #00ff88;
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
        }
        .terminal-line {
            margin-bottom: 4px;
            opacity: 0;
            animation: termFadeIn 0.3s forwards;
        }
        .terminal-line.done { color: #00ff88; }
        .terminal-line.active { color: #00d4ff; }
        .terminal-line.waiting { color: #555; }
        @keyframes termFadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #00ff88;
            margin-left: 4px;
            animation: cursorBlink 1s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .progress-bar-bottom {
            height: 3px;
            background: #1a1a3a;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            border-radius: 0 3px 3px 0;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        /* Loading Skeleton */
        .skeleton-container { display: none; margin-bottom: 24px; }
        .skeleton-container.show { display: block; }
        .skeleton {
            background: linear-gradient(90deg, #0d0d1f 25%, #1a1a2a 50%, #0d0d1f 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .skeleton-card { height: 80px; }
        .skeleton-row { height: 20px; width: 80%; }
        .skeleton-row-short { height: 20px; width: 50%; }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Results Section */
        .results-section {
            display: none;
            animation: fadeInUp 0.6s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Summary Cards - Premium Design */
        .summary-wrapper {
            display: flex;
            align-items: stretch;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            flex: 1;
        }
        .summary-card {
            background: #0d0d1f;
            border: 1px solid #1a1a3a;
            border-radius: 12px;
            padding: 20px 14px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 12px 12px 0 0;
        }
        .summary-card.critical::before { background: #ff3355; }
        .summary-card.critical { box-shadow: 0 4px 20px rgba(255, 51, 85, 0.1); }
        .summary-card.critical:hover { box-shadow: 0 4px 30px rgba(255, 51, 85, 0.25); border-color: #ff3355; }
        .summary-card.high::before { background: #ff6644; }
        .summary-card.high { box-shadow: 0 4px 20px rgba(255, 102, 68, 0.1); }
        .summary-card.high:hover { box-shadow: 0 4px 30px rgba(255, 102, 68, 0.25); border-color: #ff6644; }
        .summary-card.medium::before { background: #ffaa00; }
        .summary-card.medium { box-shadow: 0 4px 20px rgba(255, 170, 0, 0.1); }
        .summary-card.medium:hover { box-shadow: 0 4px 30px rgba(255, 170, 0, 0.25); border-color: #ffaa00; }
        .summary-card.low::before { background: #00d4ff; }
        .summary-card.low { box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1); }
        .summary-card.low:hover { box-shadow: 0 4px 30px rgba(0, 212, 255, 0.25); border-color: #00d4ff; }
        .summary-card .num {
            font-size: 32px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        .summary-card .lbl {
            font-size: 10px;
            text-transform: uppercase;
            color: #555;
            margin-top: 6px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* Risk Gauge */
        .risk-gauge-card {
            background: #0d0d1f;
            border: 1px solid #1a1a3a;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 160px;
        }
        .risk-gauge {
            width: 100px;
            height: 50px;
            position: relative;
            overflow: hidden;
        }
        .risk-gauge-bg {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 8px solid #1a1a3a;
            border-bottom-color: transparent;
            border-left-color: transparent;
            transform: rotate(225deg);
            position: absolute;
            top: 0;
            left: 0;
        }
        .risk-gauge-fill {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 8px solid transparent;
            border-top-color: #00ff88;
            border-right-color: #00ff88;
            transform: rotate(225deg);
            position: absolute;
            top: 0;
            left: 0;
            transition: all 0.8s ease;
        }
        .risk-gauge-value {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        .risk-gauge-label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            font-weight: 600;
        }
        .total-findings-center {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        /* Risk Banner */
        .risk-banner {
            background: #0d0d1f;
            border: 1px solid #1a1a3a;
            border-radius: 12px;
            padding: 16px 22px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .risk-badge {
            padding: 6px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .scan-meta { color: #555; font-size: 12px; font-family: 'JetBrains Mono', monospace; }

        /* Actions Bar */
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #0d0d1f;
            border: 1px solid #1a1a3a;
            color: #00ff88;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
        .action-btn:hover {
            background: #111;
            border-color: #00ff88;
            transform: translateY(-1px);
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: #050510;
            border-color: transparent;
            font-weight: 700;
        }
        .action-btn.primary:hover { 
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        /* Accordion Sections */
        .section-accordion {
            margin-bottom: 10px;
            border: 1px solid #1a1a3a;
            border-radius: 12px;
            overflow: hidden;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideInLeft 0.4s forwards;
        }
        @keyframes slideInLeft {
            to { opacity: 1; transform: translateX(0); }
        }
        .section-header {
            background: #0d0d1f;
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .section-header:hover { background: #111128; }
        .section-header:active { background: #0f0f24; }
        .section-header h3 {
            font-size: 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-weight: 600;
        }
        .section-header .section-icon {
            font-size: 16px;
        }
        .section-header .badge {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #00ff88;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }
        .section-header .arrow {
            transition: transform 0.3s;
            color: #555;
            flex-shrink: 0;
            font-size: 12px;
        }
        .section-header.open .arrow { transform: rotate(180deg); }
        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: #080818;
            border-top: 1px solid transparent;
        }
        .section-content.open {
            max-height: 5000px;
            border-top-color: #1a1a3a;
        }
        .section-content-inner {
            padding: 18px 20px;
        }

        /* Headers Table */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }
        .headers-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        .headers-table th, .headers-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #1a1a3a;
            font-size: 13px;
        }
        .headers-table th {
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
            position: sticky;
            top: 0;
            background: #080818;
            letter-spacing: 1px;
        }
        .check-icon { color: #00ff88; font-size: 18px; }
        .cross-icon { color: #ff3355; font-size: 18px; }

        /* Tags */
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tech-tag {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid #1a1a3a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #00ff88;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }
        .tech-tag:hover { border-color: #00ff88; background: rgba(0, 255, 136, 0.1); }

        /* Lists */
        .detail-list { list-style: none; }
        .detail-list li {
            padding: 10px 0;
            border-bottom: 1px solid #1a1a3a;
            font-size: 13px;
            color: #ccc;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .detail-list li:last-child { border-bottom: none; }

        /* Copy Button */
        .copy-btn {
            background: none;
            border: 1px solid #1a1a3a;
            color: #555;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
        }
        .copy-btn:hover { border-color: #00ff88; color: #00ff88; }
        .copy-btn.copied { border-color: #00ff88; color: #00ff88; }

        /* SSL Info */
        .ssl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .ssl-item {
            background: #0d0d1f;
            border: 1px solid #1a1a3a;
            border-radius: 10px;
            padding: 14px;
        }
        .ssl-item .label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .ssl-item .value {
            font-size: 13px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .info-item {
            background: #0d0d1f;
            border: 1px solid #1a1a3a;
            border-radius: 10px;
            padding: 14px;
        }
        .info-item .label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .info-item .value {
            font-size: 13px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
        }
        .info-item .value.good { color: #00ff88; }
        .info-item .value.warn { color: #ffaa00; }
        .info-item .value.bad { color: #ff3355; }

        /* Forms */
        .form-card {
            background: #0d0d1f;
            border: 1px solid #1a1a3a;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
        }
        .form-card .form-meta {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            word-break: break-all;
        }
        .form-issue {
            color: #ff3355;
            font-size: 12px;
            padding: 2px 0;
        }

        /* Port badges */
        .port-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .port-badge {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid #00ff88;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: #00ff88;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }
        .port-badge:hover { background: rgba(0, 255, 136, 0.1); }
        .port-badge.danger {
            border-color: #ff3355;
            color: #ff3355;
            background: rgba(255, 51, 85, 0.05);
        }

        /* Findings - Premium */
        .findings-list { display: flex; flex-direction: column; gap: 12px; }
        .finding-card {
            background: #0d0d1f;
            border: 1px solid #1a1a3a;
            border-radius: 12px;
            padding: 0;
            transition: all 0.3s;
            overflow: hidden;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideInLeft 0.4s forwards;
        }
        .finding-card:hover { border-color: #2a2a4a; transform: translateX(2px); }
        .finding-card-inner {
            padding: 18px 20px;
            border-left: 4px solid #555;
            cursor: pointer;
        }
        .finding-card-inner.sev-critical-border { border-left-color: #ff3355; }
        .finding-card-inner.sev-high-border { border-left-color: #ff6644; }
        .finding-card-inner.sev-medium-border { border-left-color: #ffaa00; }
        .finding-card-inner.sev-low-border { border-left-color: #00d4ff; }

<body>
    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Sticky Header -->
    <div class="header">
        <div class="header-inner">
            <svg class="header-shield" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 7V12C3 17.55 6.84 22.74 12 24C17.16 22.74 21 17.55 21 12V7L12 2Z" fill="url(#shieldGrad)" opacity="0.15"/>
                <path d="M12 2L3 7V12C3 17.55 6.84 22.74 12 24C17.16 22.74 21 17.55 21 12V7L12 2Z" stroke="url(#shieldGrad)" stroke-width="1.5" fill="none"/>
                <path d="M9 12L11 14L15 10" stroke="url(#shieldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="shieldGrad" x1="3" y1="2" x2="21" y2="24">
                        <stop offset="0%" stop-color="#00ff88"/>
                        <stop offset="100%" stop-color="#00d4ff"/>
                    </linearGradient>
                </defs>
            </svg>
            <h1>VULNSCAN</h1>
            <span class="version-badge">v2.0</span>
        </div>
        <p>Advanced Web Security Scanner</p>
    </div>

    <div class="container">
        <!-- Scan Input -->
        <div class="scan-box">
            <div class="input-group">
                <input type="text" class="url-input" id="urlInput"
                       placeholder="Enter target URL (e.g. https://example.com)"
                       autocomplete="off" spellcheck="false">
                <button class="scan-btn" id="scanBtn" onclick="startScan()">
                    <svg class="scan-btn-icon" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2.5"/>
                        <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                    SCAN TARGET
                </button>
            </div>
            <div class="scan-options">
                <span class="scan-chip" data-mode="headers" onclick="selectScanMode(this)">Headers Only</span>
                <span class="scan-chip active" data-mode="full" onclick="selectScanMode(this)">Full Scan</span>
                <span class="scan-chip" data-mode="domain" onclick="selectScanMode(this)">Domain Info</span>
            </div>
        </div>

        <!-- Terminal Progress -->
        <div class="progress-section" id="progressSection">
            <div class="terminal-window">
                <div class="terminal-header">
                    <span class="terminal-dot red"></span>
                    <span class="terminal-dot yellow"></span>
                    <span class="terminal-dot green"></span>
                    <span class="terminal-title">vulnscan — scanning</span>
                </div>
                <div class="terminal-body" id="terminalBody">
                </div>
                <div class="progress-bar-bottom">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <!-- Loading Skeleton -->
        <div class="skeleton-container" id="skeletonContainer">
            <div class="skeleton-grid">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="skeleton skeleton-row" style="margin-bottom:16px;"></div>
            <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
            <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
            <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
        </div>

        <!-- Results -->
        <div class="results-section" id="resultsSection">
            <div class="summary-wrapper">
                <div class="summary-cards" id="summaryCards"></div>
                <div class="risk-gauge-card" id="riskGaugeCard"></div>
            </div>
            <div class="risk-banner" id="riskBanner"></div>
            <div class="actions-bar" id="actionsBar"></div>
            <div id="detailSections"></div>
            <div class="section-accordion" style="animation-delay: 0.2s;">
                <div class="section-header" onclick="toggleSection(this)">
                    <h3><span class="section-icon">🔍</span> All Findings <span class="badge" id="findingsCount">0</span></h3>
                    <span class="arrow">▼</span>
                </div>
                <div class="section-content">
                    <div class="section-content-inner">
                        <div class="findings-list" id="findingsList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scan Another -->
        <div class="scan-another-box" id="scanAnotherBox">
            <button class="scan-another-btn" onclick="scanAnother()">🔄 Scan Another Target</button>
        </div>

        <div class="footer">
            <p>Powered by <strong style="color:#00ff88;">VULNSCAN</strong> v2.0 | Built by <strong style="color:#00d4ff;">Arpit Singh</strong></p>
            <a href="https://github.com/DAXXTEAM/VULNSCAN" target="_blank">github.com/DAXXTEAM/VULNSCAN</a>
        </div>
    </div>

    <!-- Sticky Download Bar -->
    <div class="sticky-download" id="stickyDownload">
        <div class="download-btns">
            <button onclick="downloadReport('pdf')" class="dl-btn dl-pdf">
                ⬇ Download PDF Report
            </button>
            <button onclick="downloadReport('html')" class="dl-btn dl-html">
                ⬇ Download HTML Report
            </button>
            <button onclick="if(currentScanId) window.open('/report/' + currentScanId)" class="dl-btn dl-view">
                👁 View Full Report
            </button>
        </div>
    </div>


    <script>
        const urlInput = document.getElementById('urlInput');
        let currentScanId = '';
        let selectedScanMode = 'full';

        urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startScan(); });
        urlInput.addEventListener('input', validateUrlInput);

        function validateUrlInput() {
            const val = urlInput.value.trim();
            if (!val) { urlInput.classList.remove('invalid'); return; }
            try {
                const url = new URL(val.startsWith('http') ? val : 'https://' + val);
                if (url.hostname.includes('.')) {
                    urlInput.classList.remove('invalid');
                } else {
                    urlInput.classList.add('invalid');
                }
            } catch {
                urlInput.classList.add('invalid');
            }
        }

        function selectScanMode(el) {
            document.querySelectorAll('.scan-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedScanMode = el.dataset.mode;
        }

        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function toggleSection(el) {
            el.classList.toggle('open');
            const content = el.nextElementSibling;
            content.classList.toggle('open');
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✓';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✓';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
            });
        }

        function toggleFinding(el) {
            const desc = el.querySelector('.finding-desc');
            const fix = el.querySelector('.finding-fix');
            const hint = el.querySelector('.finding-expand-hint');
            const isExpanded = desc.classList.contains('expanded');
            desc.classList.toggle('expanded');
            fix.classList.toggle('expanded');
            if (hint) hint.textContent = isExpanded ? '▸ Click to expand' : '▾ Click to collapse';
        }

        function scanAnother() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('scanAnotherBox').classList.remove('show');
            document.getElementById('stickyDownload').classList.remove('show');
            urlInput.value = '';
            urlInput.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function addTerminalLine(text, status) {
            const body = document.getElementById('terminalBody');
            const line = document.createElement('div');
            line.className = 'terminal-line ' + status;
            const prefix = status === 'done' ? '[✓]' : status === 'active' ? '[~]' : '[○]';
            line.innerHTML = `<span>${prefix}</span> ${text}`;
            // Remove old cursor
            const oldCursor = body.querySelector('.terminal-cursor');
            if (oldCursor) oldCursor.remove();
            // Add cursor to new line
            const cursor = document.createElement('span');
            cursor.className = 'terminal-cursor';
            line.appendChild(cursor);
            body.appendChild(line);
            body.scrollTop = body.scrollHeight;
        }

        function markLastLineDone() {
            const body = document.getElementById('terminalBody');
            const lines = body.querySelectorAll('.terminal-line');
            if (lines.length) {
                const last = lines[lines.length - 1];
                last.classList.remove('active');
                last.classList.add('done');
                last.innerHTML = last.innerHTML.replace('[~]', '[✓]').replace('[○]', '[✓]');
            }
        }

        async function startScan() {
            const url = urlInput.value.trim();
            if (!url) {
                urlInput.classList.add('invalid');
                urlInput.focus();
                setTimeout(() => urlInput.classList.remove('invalid'), 2000);
                return;
            }

            // URL validation
            try {
                const testUrl = new URL(url.startsWith('http') ? url : 'https://' + url);
                if (!testUrl.hostname.includes('.')) throw new Error('invalid');
            } catch {
                urlInput.classList.add('invalid');
                showToast('⚠️ Invalid URL format', 3000);
                return;
            }

            showToast('🚀 Scan initiated for ' + url);

            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = true;
            scanBtn.innerHTML = '<svg class="scan-btn-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-dasharray="30 70" style="animation: spin 1s linear infinite;"/></svg> SCANNING...';
            scanBtn.classList.add('scanning');
            document.getElementById('progressSection').style.display = 'block';
            document.getElementById('terminalBody').innerHTML = '';
            document.getElementById('skeletonContainer').classList.add('show');
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('scanAnotherBox').classList.remove('show');
            document.getElementById('stickyDownload').classList.remove('show');

            const steps = [
                'Resolving DNS...', 'Querying WHOIS records...',
                'Checking SSL/TLS certificates...', 'Analyzing security headers...',
                'Detecting technology stack...', 'Scanning exposed paths...',
                'Checking robots.txt & sitemap...', 'Analyzing cookies & CORS...',
                'Port scanning (21 ports)...', 'Harvesting emails...',
                'Enumerating subdomains...', 'Analyzing page content...',
                'Checking performance & CDN...', 'Verifying SPF/DMARC...',
                'Testing HTTP methods...', 'Checking social presence...',
                'Querying Wayback Machine...', 'IP geolocation lookup...',
                'Analyzing JavaScript files...', 'Checking external resources...',
                'Analyzing forms & inputs...', 'Generating report...'
            ];

            let step = 0;
            addTerminalLine(steps[0], 'active');
            step++;

            const progressInterval = setInterval(() => {
                if (step < steps.length) {
                    markLastLineDone();
                    addTerminalLine(steps[step], 'active');
                    document.getElementById('progressFill').style.width = ((step + 1) / steps.length * 90) + '%';
                    step++;
                }
            }, 2500);

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                clearInterval(progressInterval);
                markLastLineDone();
                addTerminalLine('Scan complete! ✓', 'done');
                document.getElementById('progressFill').style.width = '100%';

                const data = await response.json();

                if (data.status === 'running') {
                    await pollForResults(data.scan_id);
                } else if (data.error && !data.findings) {
                    showError(data.error);
                } else {
                    setTimeout(() => renderResults(data), 500);
                }
            } catch (err) {
                clearInterval(progressInterval);
                showError('Network error: ' + err.message);
            }

            scanBtn.disabled = false;
            scanBtn.innerHTML = '<svg class="scan-btn-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2.5"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg> SCAN TARGET';
            scanBtn.classList.remove('scanning');
            document.getElementById('skeletonContainer').classList.remove('show');
        }

        async function pollForResults(scanId) {
            for (let i = 0; i < 60; i++) {
                await new Promise(r => setTimeout(r, 2000));
                const resp = await fetch(`/scan/${scanId}/status`);
                const data = await resp.json();
                if (data.status === 'complete') {
                    renderResults(data.result);
                    return;
                }
                if (data.status === 'error') {
                    showError('Scan failed');
                    return;
                }
            }
            showError('Scan timed out');
        }

        function showError(msg) {
            document.getElementById('progressSection').style.display = 'none';
            document.getElementById('skeletonContainer').classList.remove('show');
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('summaryCards').innerHTML = '';
            document.getElementById('riskGaugeCard').innerHTML = '';
            document.getElementById('riskBanner').innerHTML = `<span style="color:#ff3355">⚠ Error: ${msg}</span>`;
            document.getElementById('detailSections').innerHTML = '';
            document.getElementById('findingsList').innerHTML = '';
            document.getElementById('actionsBar').innerHTML = '';
            document.getElementById('scanAnotherBox').classList.add('show');
            showToast('❌ ' + msg, 4000);
        }

        function getRiskColor(level) {
            const colors = { CRITICAL: '#ff3355', HIGH: '#ff6644', MEDIUM: '#ffaa00', LOW: '#00d4ff', INFORMATIONAL: '#888' };
            return colors[level] || '#888';
        }

        function getCvssClass(score) {
            if (score >= 9) return 'cvss-critical';
            if (score >= 7) return 'cvss-high';
            if (score >= 4) return 'cvss-medium';
            if (score > 0) return 'cvss-low';
            return 'cvss-info';
        }

        function getRiskGaugeRotation(level) {
            const map = { CRITICAL: 0.95, HIGH: 0.75, MEDIUM: 0.5, LOW: 0.25, INFORMATIONAL: 0.1 };
            return map[level] || 0.1;
        }

        function renderResults(data) {
            document.getElementById('progressSection').style.display = 'none';
            document.getElementById('skeletonContainer').classList.remove('show');
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('scanAnotherBox').classList.add('show');
            document.getElementById('stickyDownload').classList.add('show');

            currentScanId = data.scan_id;
            showToast('✅ Scan complete! ' + data.total_findings + ' findings (' + (data.modules_count || 24) + ' modules)');

            const riskColor = getRiskColor(data.risk_level);

            // Summary Cards with stagger animation
            document.getElementById('summaryCards').innerHTML = `
                <div class="summary-card critical stagger-in" style="animation-delay:0.1s"><div class="num" style="color:#ff3355">${data.stats.critical}</div><div class="lbl">Critical</div></div>
                <div class="summary-card high stagger-in" style="animation-delay:0.2s"><div class="num" style="color:#ff6644">${data.stats.high}</div><div class="lbl">High</div></div>
                <div class="summary-card medium stagger-in" style="animation-delay:0.3s"><div class="num" style="color:#ffaa00">${data.stats.medium}</div><div class="lbl">Medium</div></div>
                <div class="summary-card low stagger-in" style="animation-delay:0.4s"><div class="num" style="color:#00d4ff">${data.stats.low}</div><div class="lbl">Low</div></div>
            `;

            // Risk Gauge
            const gaugePercent = getRiskGaugeRotation(data.risk_level);
            const gaugeAngle = gaugePercent * 270;
            document.getElementById('riskGaugeCard').innerHTML = `
                <div class="risk-gauge">
                    <div class="risk-gauge-bg"></div>
                    <div class="risk-gauge-fill" style="clip-path: none; border-top-color:${riskColor}; border-right-color:${riskColor};"></div>
                    <div class="risk-gauge-value" style="color:${riskColor}">${data.max_cvss}</div>
                </div>
                <div class="risk-gauge-label">Risk Score</div>
                <div class="total-findings-center">${data.total_findings} total findings</div>
            `;

            document.getElementById('riskBanner').innerHTML = `
                <div>
                    <span class="risk-badge" style="background:${riskColor};color:#fff">${data.risk_level}</span>
                    <span style="margin-left:12px;color:#666;font-size:12px;">Max CVSS: ${data.max_cvss} | ${data.modules_count || 24} modules</span>
                </div>
                <div class="scan-meta">
                    ${data.total_findings} findings • ${data.duration_seconds}s • ${data.paths_checked || '100+'} paths
                </div>
            `;

            document.getElementById('actionsBar').innerHTML = `
                <a class="action-btn" href="/report/${data.scan_id}" target="_blank">📄 HTML Report</a>
                <a class="action-btn" href="/report/${data.scan_id}/json" target="_blank">💾 JSON Export</a>
                <a class="action-btn" href="/scan/${data.scan_id}/details" target="_blank">📋 Full Details</a>
                <button class="action-btn primary" onclick="downloadReport('pdf')">⬇ PDF Report</button>
            `;

            let sections = '';
            const details = data.details || {};

            // Domain Intelligence (WHOIS)
            const whois = details.whois_detail || {};
            sections += buildAccordion('🌐', 'Domain Intelligence', whois.registrar ? whois.registrar : '', renderWhois(whois));

            // IP & Location
            const geo = details.geo_detail || {};
            sections += buildAccordion('📍', 'IP & Location', geo.ip || '', renderGeo(geo));

            // Open Ports
            const ports = details.open_ports || [];
            sections += buildAccordion('🔌', 'Open Ports', `${ports.length} open`, renderPorts(ports));

            // Subdomains
            const subdomains = details.subdomains || [];
            sections += buildAccordion('🔎', 'Subdomains', `${subdomains.length} found`, renderSubdomains(subdomains));

            // Content Analysis
            const content = details.content_detail || {};
            sections += buildAccordion('📄', 'Content Analysis', content.title ? `"${content.title.substring(0, 30)}..."` : '', renderContent(content));

            // Performance
            const perf = details.performance_detail || {};
            sections += buildAccordion('⚡', 'Performance', perf.load_time_seconds ? `${perf.load_time_seconds}s` : '', renderPerformance(perf));

            // Email Security
            const emailSec = details.email_security || {};
            sections += buildAccordion('📧', 'Email Security', '', renderEmailSecurity(emailSec));

            // Archive History
            const wayback = details.wayback_detail || {};
            sections += buildAccordion('📚', 'Archive History', wayback.available ? 'Archived' : 'Not found', renderWayback(wayback));

            // Social Presence
            const socialPresence = details.social_presence || {};
            const presenceCount = Object.values(socialPresence).filter(v => v.exists).length;
            sections += buildAccordion('👤', 'Social Presence', `${presenceCount}/${Object.keys(socialPresence).length}`, renderSocialPresence(socialPresence));

            // HTTP Methods
            const httpMethods = details.http_methods || [];
            sections += buildAccordion('🔧', 'HTTP Methods', httpMethods.length ? `${httpMethods.length} allowed` : 'Restricted', renderHTTPMethods(httpMethods));

            // Exposed Files
            const exposedFiles = details.exposed_files || [];
            const exposed200 = exposedFiles.filter(f => f.status === 200);
            const exposed403 = exposedFiles.filter(f => f.status === 403);
            sections += buildAccordion('📂', 'Exposed Files', `${exposed200.length} accessible, ${exposed403.length} forbidden`, renderExposedFiles(exposed200, exposed403));

            // Security Headers
            sections += buildAccordion('🛡️', 'Security Headers', '', renderHeadersTable(details.headers_detail || {}));

            // Technology Stack
            const techList = details.tech_list || [];
            sections += buildAccordion('⚙️', 'Technology Stack', `${techList.length} detected`, renderTechStack(techList, details.tech_detail || {}));

            // SSL/TLS
            sections += buildAccordion('🔒', 'SSL/TLS Certificate', '', renderSSL(details.ssl_detail || {}));

            // Emails Found
            const emails = details.emails || [];
            sections += buildAccordion('✉️', 'Emails Harvested', `${emails.length}`, renderEmails(emails));

            // Form Analysis
            const forms = details.forms || [];
            sections += buildAccordion('📝', 'Form Analysis', `${forms.length} forms`, renderForms(forms));

            // Social Media Links
            const social = details.social_links || {};
            const socialCount = Object.keys(social).length;
            sections += buildAccordion('🌍', 'Social Media Links', `${socialCount} platforms`, renderSocial(social));

            // External Resources
            const extDomains = details.external_domains || [];
            sections += buildAccordion('🔗', 'External Resources', `${extDomains.length} domains`, renderExternal(extDomains));

            // JavaScript
            const jsFiles = details.javascript || [];
            sections += buildAccordion('📜', 'JavaScript Files', `${jsFiles.length} scripts`, renderJS(jsFiles));

            document.getElementById('detailSections').innerHTML = sections;

            // Apply stagger animation to sections
            const sectionEls = document.querySelectorAll('#detailSections .section-accordion');
            sectionEls.forEach((el, i) => {
                el.style.animationDelay = (i * 0.05) + 's';
            });

            document.getElementById('findingsCount').textContent = data.total_findings;
            let html = '';
            data.findings.forEach((f, idx) => {
                const sevBorder = `sev-${f.severity}-border`;
                const cvssClass = getCvssClass(f.cvss_score);
                html += `
                <div class="finding-card" style="animation-delay:${idx * 0.05}s">
                    <div class="finding-card-inner ${sevBorder}" onclick="toggleFinding(this)">
                        <div class="finding-top">
                            <span class="sev-badge sev-${f.severity}">${f.severity}</span>
                            <span class="cvss-tag ${cvssClass}">CVSS ${f.cvss_score}</span>
                            <span class="category-tag">${f.category || ''}</span>
                        </div>
                        <div class="finding-title">${escapeHtml(f.title)}</div>
                        <div class="finding-expand-hint">▸ Click to expand</div>
                        <div class="finding-desc">${escapeHtml(f.description)}</div>
                        <div class="finding-fix"><strong>Fix:</strong> ${escapeHtml(f.recommendation)}</div>
                    </div>
                </div>`;
            });
            document.getElementById('findingsList').innerHTML = html;

            setTimeout(() => {
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function buildAccordion(icon, title, badge, content) {
            return `
            <div class="section-accordion">
                <div class="section-header" onclick="toggleSection(this)">
                    <h3><span class="section-icon">${icon}</span> ${title} ${badge ? `<span class="badge">${escapeHtml(badge)}</span>` : ''}</h3>
                    <span class="arrow">▼</span>
                </div>
                <div class="section-content">
                    <div class="section-content-inner">${content}</div>
                </div>
            </div>`;
        }

        // ===== RENDER FUNCTIONS =====

        function renderWhois(whois) {
            if (!Object.keys(whois).length || whois.registrar === 'N/A' && !whois.created) return '<p class="no-data">WHOIS data not available for this domain.</p>';
            let html = '<div class="info-grid">';
            const items = [
                ['Registrar', whois.registrar || 'N/A'],
                ['Created', whois.created || 'N/A'],
                ['Expires', whois.expires || 'N/A'],
                ['Updated', whois.updated || 'N/A'],
                ['Domain Age', whois.domain_age || 'N/A'],
                ['Days to Expire', whois.days_to_expire !== undefined ? String(whois.days_to_expire) : 'N/A'],
                ['Organization', whois.org || 'N/A'],
                ['Country', whois.country || 'N/A'],
            ];
            for (const [label, value] of items) {
                let cls = '';
                if (label === 'Days to Expire') {
                    const d = parseInt(value);
                    if (!isNaN(d)) cls = d < 30 ? 'bad' : d < 90 ? 'warn' : 'good';
                }
                html += `<div class="info-item"><div class="label">${label}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            if (whois.name_servers && whois.name_servers.length) {
                html += `<div style="margin-top:12px;"><strong style="color:#555;font-size:11px;letter-spacing:1px;">NAME SERVERS:</strong><div style="margin-top:4px;font-size:12px;color:#888;font-family:'JetBrains Mono',monospace;">${whois.name_servers.join(', ')}</div></div>`;
            }
            return html;
        }

        function renderGeo(geo) {
            if (!geo.ip) return '<p class="no-data">IP geolocation data not available.</p>';
            let html = '<div class="info-grid">';
            const items = [
                ['IP Address', geo.ip],
                ['Country', geo.country || 'N/A'],
                ['Region', geo.region || 'N/A'],
                ['City', geo.city || 'N/A'],
                ['ISP', geo.isp || 'N/A'],
                ['Organization', geo.org || 'N/A'],
                ['AS Number', geo.as || 'N/A'],
                ['Coordinates', geo.lat && geo.lon ? `${geo.lat}, ${geo.lon}` : 'N/A'],
            ];
            for (const [label, value] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value">${escapeHtml(String(value))}</div></div>`;
            }
            html += '</div>';
            return html;
        }

        function renderSubdomains(subdomains) {
            if (!subdomains.length) return '<p class="no-data">No subdomains found from common prefixes scan.</p>';
            let html = `<p style="color:#666;font-size:12px;margin-bottom:12px;">${subdomains.length} subdomains discovered:</p>`;
            html += '<div class="subdomain-grid">';
            for (const s of subdomains) {
                html += `<div class="subdomain-item"><span class="sub-name">${escapeHtml(s.subdomain)}</span><span class="sub-ip">${escapeHtml(s.ip)}</span></div>`;
            }
            html += '</div>';
            return html;
        }

        function renderContent(content) {
            if (!Object.keys(content).length) return '<p class="no-data">Content analysis data not available.</p>';
            let html = '<div class="info-grid">';
            const items = [
                ['Title', content.title || '(No title)'],
                ['Word Count', String(content.word_count || 0)],
                ['Page Size', `${content.page_size_kb || 0} KB`],
                ['Total Links', String(content.total_links || 0)],
                ['Internal Links', String(content.internal_links || 0)],
                ['External Links', String(content.external_links || 0)],
                ['Images', String(content.images || 0)],
                ['Scripts', String(content.scripts || 0)],
            ];
            for (const [label, value] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            if (content.meta_description) {
                html += `<div style="margin-top:12px;"><strong style="color:#555;font-size:11px;letter-spacing:1px;">META DESCRIPTION:</strong><div style="margin-top:4px;font-size:12px;color:#999;">${escapeHtml(content.meta_description)}</div></div>`;
            }
            if (content.h1_tags && content.h1_tags.length) {
                html += `<div style="margin-top:10px;"><strong style="color:#555;font-size:11px;letter-spacing:1px;">H1 TAGS:</strong><div style="margin-top:4px;font-size:12px;color:#888;">${content.h1_tags.map(h => escapeHtml(h)).join(' | ')}</div></div>`;
            }
            if (content.contact_emails && content.contact_emails.length) {
                html += `<div style="margin-top:10px;"><strong style="color:#555;font-size:11px;letter-spacing:1px;">CONTACT EMAILS:</strong><div style="margin-top:4px;font-size:12px;color:#00ff88;font-family:'JetBrains Mono',monospace;">${content.contact_emails.join(', ')}</div></div>`;
            }
            if (content.phone_numbers && content.phone_numbers.length) {
                html += `<div style="margin-top:10px;"><strong style="color:#555;font-size:11px;letter-spacing:1px;">PHONE NUMBERS:</strong><div style="margin-top:4px;font-size:12px;color:#00ff88;font-family:'JetBrains Mono',monospace;">${content.phone_numbers.join(', ')}</div></div>`;
            }
            return html;
        }

        function renderPerformance(perf) {
            if (!Object.keys(perf).length) return '<p class="no-data">Performance data not available.</p>';
            let timeClass = perf.load_time_seconds < 2 ? 'good' : perf.load_time_seconds < 5 ? 'warn' : 'bad';
            let html = '<div class="info-grid">';
            const items = [
                ['Load Time', `${perf.load_time_seconds}s`, timeClass],
                ['Response Size', `${perf.response_size_kb} KB`, ''],
                ['Status Code', String(perf.status_code || 'N/A'), perf.status_code === 200 ? 'good' : 'warn'],
                ['CDN Detected', perf.cdn_detected ? `Yes (${perf.cdn_provider || 'Unknown'})` : 'No', perf.cdn_detected ? 'good' : ''],
                ['Cache Control', perf.cache_control || 'None', perf.cache_control && perf.cache_control !== 'None' ? 'good' : 'warn'],
                ['Compression', perf.content_encoding || 'None', perf.content_encoding && perf.content_encoding !== 'None' ? 'good' : 'warn'],
            ];
            for (const [label, value, cls] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            return html;
        }

        function renderEmailSecurity(emailSec) {
            if (!Object.keys(emailSec).length) return '<p class="no-data">Email security data not available.</p>';
            let html = '<div class="info-grid">';
            const spfStatus = emailSec.spf ? 'Configured' : 'Missing';
            const dmarcStatus = emailSec.dmarc ? 'Configured' : 'Missing';
            const items = [
                ['SPF Record', spfStatus, emailSec.spf ? 'good' : 'bad'],
                ['DMARC Record', dmarcStatus, emailSec.dmarc ? 'good' : 'bad'],
                ['MX Records', emailSec.mx_records ? `${emailSec.mx_records.length} found` : 'None', emailSec.mx_records && emailSec.mx_records.length ? 'good' : ''],
            ];
            for (const [label, value, cls] of items) {
                html += `<div class="info-item"><div class="label">${label}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>`;
            }
            html += '</div>';
            if (emailSec.spf) {
                html += `<div style="margin-top:12px;"><strong style="color:#555;font-size:11px;letter-spacing:1px;">SPF:</strong><div style="margin-top:4px;font-size:11px;color:#00ff88;font-family:'JetBrains Mono',monospace;word-break:break-all;">${escapeHtml(emailSec.spf)}</div></div>`;
            }
            if (emailSec.dmarc) {
                html += `<div style="margin-top:10px;"><strong style="color:#555;font-size:11px;letter-spacing:1px;">DMARC:</strong><div style="margin-top:4px;font-size:11px;color:#00ff88;font-family:'JetBrains Mono',monospace;word-break:break-all;">${escapeHtml(emailSec.dmarc)}</div></div>`;
            }
            if (emailSec.mx_records && emailSec.mx_records.length) {
                html += `<div style="margin-top:10px;"><strong style="color:#555;font-size:11px;letter-spacing:1px;">MX RECORDS:</strong><div style="margin-top:4px;font-size:11px;color:#888;font-family:'JetBrains Mono',monospace;">${emailSec.mx_records.join('<br>')}</div></div>`;
            }
            return html;
        }

        function renderWayback(wayback) {
            if (!Object.keys(wayback).length) return '<p class="no-data">Wayback Machine data not available.</p>';
            if (!wayback.available) return '<p class="no-data">No archived snapshots found on the Wayback Machine.</p>';
            let ts = wayback.timestamp || '';
            let formatted = ts.length >= 8 ? `${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)}` : ts;
            let html = '<div class="info-grid">';
            html += `<div class="info-item"><div class="label">Status</div><div class="value good">Archived</div></div>`;
            html += `<div class="info-item"><div class="label">Last Snapshot</div><div class="value">${escapeHtml(formatted)}</div></div>`;
            html += '</div>';
            if (wayback.url) {
                html += `<div style="margin-top:12px;"><a href="${escapeHtml(wayback.url)}" target="_blank" style="color:#00ff88;font-size:12px;text-decoration:none;">View on Wayback Machine →</a></div>`;
            }
            return html;
        }

        function renderSocialPresence(presence) {
            if (!Object.keys(presence).length) return '<p class="no-data">Social media presence check not available.</p>';
            let html = '<div class="social-grid">';
            for (const [platform, info] of Object.entries(presence)) {
                const dotClass = info.exists ? 'found' : 'not-found';
                const statusText = info.exists ? 'Found' : 'Not found';
                html += `<div class="social-item">
                    <span class="status-dot ${dotClass}"></span>
                    <div>
                        <div class="platform">${platform}</div>
                        <div style="font-size:11px;color:#555;">${statusText}</div>
                    </div>
                    ${info.exists ? `<a href="${escapeHtml(info.url)}" target="_blank" style="color:#00ff88;font-size:11px;margin-left:auto;text-decoration:none;">Visit →</a>` : ''}
                </div>`;
            }
            html += '</div>';
            return html;
        }

        function renderHTTPMethods(methods) {
            if (!methods.length) return '<p style="color:#00ff88;font-size:13px;">✓ All dangerous HTTP methods are properly restricted.</p>';
            let html = '<div class="port-badges">';
            for (const m of methods) {
                const isDangerous = ['TRACE', 'TRACK', 'PUT', 'DELETE'].includes(m.method);
                html += `<span class="port-badge ${isDangerous ? 'danger' : ''}">${m.method} (${m.status})</span>`;
            }
            html += '</div>';
            return html;
        }

        function renderExposedFiles(exposed200, exposed403) {
            if (!exposed200.length && !exposed403.length) return '<p class="no-data">No exposed files found. All 100+ paths returned 404.</p>';
            let html = '';
            if (exposed200.length) {
                html += '<h4 style="color:#ff3355;margin-bottom:8px;">⚠ Accessible (HTTP 200)</h4><ul class="detail-list">';
                for (const f of exposed200) {
                    html += `<li>
                        <span style="color:${f.severity==='high'?'#ff3355':'#ffaa00'}">[${f.severity.toUpperCase()}]</span>
                        <a href="${escapeHtml(f.url)}" target="_blank" style="color:#00ff88;flex:1;min-width:0;word-break:break-all;text-decoration:none;">${escapeHtml(f.path)}</a>
                        <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(f.url)}', this)">Copy</button>
                    </li>`;
                }
                html += '</ul>';
            }
            if (exposed403.length) {
                html += '<h4 style="color:#ffaa00;margin:16px 0 8px;">🔒 Forbidden (HTTP 403)</h4><ul class="detail-list">';
                for (const f of exposed403) {
                    html += `<li style="color:#666;">${escapeHtml(f.path)}</li>`;
                }
                html += '</ul>';
            }
            return html;
        }

        function renderHeadersTable(headers) {
            if (!Object.keys(headers).length) return '<p class="no-data">No header data available.</p>';
            let html = '<div class="table-wrapper"><table class="headers-table"><tr><th>Header</th><th>Status</th><th>Expected</th><th>Actual</th></tr>';
            for (const [name, info] of Object.entries(headers)) {
                const icon = info.present ? '<span class="check-icon">✓</span>' : '<span class="cross-icon">✗</span>';
                html += `<tr>
                    <td style="color:#fff;font-weight:600;">${name}</td>
                    <td>${icon}</td>
                    <td style="color:#555;font-family:'JetBrains Mono',monospace;font-size:11px;">${escapeHtml(info.expected || '')}</td>
                    <td style="color:${info.present ? '#00ff88' : '#ff3355'};font-family:'JetBrains Mono',monospace;font-size:11px;">${info.present ? escapeHtml(info.actual || 'Set') : 'Missing'}</td>
                </tr>`;
            }
            html += '</table></div>';
            return html;
        }

        function renderTechStack(techList, techDetail) {
            if (!techList.length && !Object.keys(techDetail).length) return '<p class="no-data">No technologies detected.</p>';
            let html = '<div class="tech-tags">';
            for (const t of techList) {
                html += `<span class="tech-tag">${escapeHtml(t)}</span>`;
            }
            html += '</div>';
            if (Object.keys(techDetail).length) {
                html += '<div style="margin-top:12px;font-size:12px;color:#888;">';
                for (const [key, val] of Object.entries(techDetail)) {
                    html += `<div><strong style="color:#555;">${key}:</strong> <span style="color:#ccc;">${escapeHtml(String(val))}</span></div>`;
                }
                html += '</div>';
            }
            return html;
        }

        function renderSSL(ssl) {
            if (!Object.keys(ssl).length) return '<p class="no-data">No SSL data available.</p>';
            if (ssl.error) return `<p style="color:#ff3355;">SSL Error: ${escapeHtml(ssl.error)}</p>`;
            let html = '<div class="ssl-grid">';
            const items = [
                ['Status', ssl.valid ? '✓ Valid' : '✗ Invalid', ssl.valid ? '#00ff88' : '#ff3355'],
                ['Days Left', String(ssl.days_remaining || 'N/A'), ssl.days_remaining > 30 ? '#00ff88' : '#ff3355'],
                ['Expires', ssl.expires || 'N/A', '#fff'],
                ['Issued', ssl.issued || 'N/A', '#fff'],
                ['Issuer', ssl.issuer || 'N/A', '#fff'],
                ['Subject', ssl.subject || 'N/A', '#fff'],
                ['Protocol', ssl.protocol || 'N/A', '#00ff88'],
                ['Old TLS', ssl.deprecated_tls ? 'YES ⚠' : 'No', ssl.deprecated_tls ? '#ff3355' : '#00ff88'],
            ];
            for (const [label, value, color] of items) {
                html += `<div class="ssl-item"><div class="label">${label}</div><div class="value" style="color:${color}">${value}</div></div>`;
            }
            html += '</div>';
            if (ssl.sans && ssl.sans.length) {
                html += `<div style="margin-top:12px;"><strong style="color:#555;font-size:12px;letter-spacing:1px;">SANs:</strong><div style="font-size:12px;color:#888;margin-top:4px;word-break:break-all;font-family:'JetBrains Mono',monospace;">${ssl.sans.join(', ')}</div></div>`;
            }
            return html;
        }

        function renderEmails(emails) {
            if (!emails.length) return '<p class="no-data">No email addresses found in page source.</p>';
            let html = '<ul class="detail-list">';
            for (const e of emails) {
                html += `<li>✉️ <span style="flex:1;min-width:0;">${escapeHtml(e)}</span><button class="copy-btn" onclick="copyToClipboard('${escapeHtml(e)}', this)">Copy</button></li>`;
            }
            html += '</ul>';
            return html;
        }

        function renderForms(forms) {
            if (!forms.length) return '<p class="no-data">No HTML forms found on the page.</p>';
            let html = '';
            for (const f of forms) {
                html += `<div class="form-card">
                    <div class="form-meta">Form #${f.index} • Method: <strong>${f.method}</strong> • Action: <code style="color:#00d4ff;">${escapeHtml(f.action || '(same page)')}</code> • ${f.input_count} inputs ${f.has_password ? '🔑' : ''}</div>`;
                if (f.issues && f.issues.length) {
                    for (const issue of f.issues) {
                        html += `<div class="form-issue">⚠ ${escapeHtml(issue)}</div>`;
                    }
                } else {
                    html += '<div style="color:#00ff88;font-size:12px;">✓ No issues detected</div>';
                }
                html += '</div>';
            }
            return html;
        }

        function renderPorts(ports) {
            if (!ports.length) return '<p class="no-data">No open ports detected (scanned 21 common ports).</p>';
            let html = '<div class="port-badges">';
            const dangerousPorts = [21, 23, 445, 3306, 3389, 5432, 5900, 6379, 9200, 27017, 11211];
            for (const p of ports) {
                const isDangerous = dangerousPorts.includes(p.port);
                html += `<span class="port-badge ${isDangerous ? 'danger' : ''}">${p.port}/${p.service}</span>`;
            }
            html += '</div>';
            return html;
        }

        function renderSocial(social) {
            if (!Object.keys(social).length) return '<p class="no-data">No social media links found in page source.</p>';
            let html = '<ul class="detail-list">';
            for (const [platform, links] of Object.entries(social)) {
                for (const link of links) {
                    html += `<li>
                        <strong style="color:#00ff88;">${platform}:</strong>
                        <a href="${escapeHtml(link)}" target="_blank" style="color:#888;flex:1;min-width:0;word-break:break-all;text-decoration:none;">${escapeHtml(link)}</a>
                        <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(link)}', this)">Copy</button>
                    </li>`;
                }
            }
            html += '</ul>';
            return html;
        }

        function renderExternal(domains) {
            if (!domains.length) return '<p class="no-data">No external domains detected.</p>';
            let html = `<p style="color:#666;font-size:12px;margin-bottom:10px;">${domains.length} external domains loading resources:</p>`;
            html += '<div class="tech-tags">';
            for (const d of domains) {
                html += `<span class="tech-tag" style="color:#888;border-color:#1a1a3a;">${escapeHtml(d)}</span>`;
            }
            html += '</div>';
            return html;
        }

        function renderJS(jsFiles) {
            if (!jsFiles.length) return '<p class="no-data">No external JavaScript files detected.</p>';
            let html = '<ul class="detail-list">';
            for (const js of jsFiles) {
                let issues = '';
                if (js.issues && js.issues.length) {
                    issues = ' <span style="color:#ff3355;">(' + js.issues.join(', ') + ')</span>';
                }
                const icon = js.external ? '🌐' : '📄';
                html += `<li>${icon} <span style="flex:1;min-width:0;word-break:break-all;color:#ccc;">${escapeHtml(js.src)}</span>${issues}<button class="copy-btn" onclick="copyToClipboard('${escapeHtml(js.src)}', this)">Copy</button></li>`;
            }
            html += '</ul>';
            return html;
        }

        function downloadReport(type) {
            if (!currentScanId) return;
            if (type === 'pdf') {
                window.open('/report/' + currentScanId + '/pdf', '_blank');
                showToast('📥 Generating PDF report...');
            } else if (type === 'html') {
                window.open('/report/' + currentScanId, '_blank');
                showToast('📄 Opening HTML report...');
            } else {
                // JSON fallback
                fetch(`/report/${currentScanId}/json`)
                    .then(r => r.blob())
                    .then(blob => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `vulnscan-report-${currentScanId}.json`;
                        a.click();
                        URL.revokeObjectURL(url);
                        showToast('📥 JSON report downloaded');
                    });
            }
        }

        function downloadCurrentReport() {
            downloadReport('pdf');
        }
    </script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
